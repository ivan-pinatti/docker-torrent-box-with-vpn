# Accept 200-299 and 429 (rate-limited)
accept = [200, 429]

# Timeout in seconds per request
timeout = 20

# Max retries per URL
max_retries = 3

# Exclude patterns (supplements .lycheeignore)
exclude = [
  "^mailto:",
  "^https?://localhost(:[0-9]+)?(/.*)?$",
  "^https?://127\\.0\\.0\\.1(:[0-9]+)?(/.*)?$",
  "^https?://.*\\.internal(:[0-9]+)?(/.*)?$",
  "^https?://172\\.16\\..*(:[0-9]+)?(/.*)?$",
  "^https?://192\\.168\\..*(:[0-9]+)?(/.*)?$",
  "^https?://10\\..*(:[0-9]+)?(/.*)?$",
]
