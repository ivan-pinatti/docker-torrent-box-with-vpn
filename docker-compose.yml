networks:
  edge:
    driver: bridge

  wan:
    driver: bridge

  # apps, services, media, and observability are created ahead of time by
  # `make start` (see its own network create calls), not by compose, so
  # every docker-compose.routes/*.yml override and every included compose
  # file here can all attach to the same networks regardless of which one
  # actually happens to run first. Real Docker Compose enforces network
  # ownership strictly: without external: true here, it tries to create
  # (and therefore own) these too, and fails outright with "conflicts with
  # imported resource" once it finds one already exists, confirmed live in
  # CI. Podman tolerates the same mismatch silently, which is why this
  # went unnoticed locally.
  apps:
    external: true
    name: docker-torrent-box-with-vpn_apps

  services:
    external: true
    name: docker-torrent-box-with-vpn_services

  media:
    external: true
    name: docker-torrent-box-with-vpn_media

  observability:
    external: true
    name: docker-torrent-box-with-vpn_observability

include:
  - docker-compose-media-library.yml
  - docker-compose-nzb.yml
  - docker-compose-observability.yml
  - docker-compose-proxy.yml
  - docker-compose-servarr.yml
  - docker-compose-torrent.yml
  - docker-compose-vpn.yml
