version: 2

# The three ecosystems below are staggered onto separate days rather than all
# opening Monday, so the suites they trigger do not queue behind one another
# and so a person does not see every dependency pull request for the week
# arrive as one batch. Security updates are not affected either way: they are
# alert driven and open as soon as GitHub raises the alert, ignoring this
# schedule entirely.
updates:
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/Toronto"
    labels:
      - dependencies
      - pre-commit
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:30"
      timezone: "America/Toronto"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: weekly
      day: wednesday
      time: "07:00"
      timezone: "America/Toronto"
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      test-dependencies:
        patterns:
          - "*"
