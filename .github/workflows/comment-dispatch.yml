---
name: Comment-Triggered Checks

# Lets a maintainer comment `/run-checks` on a PR to re-run pre-commit
# (PR Validation's pr_check + prerequisites + integration jobs) and
# MegaLinter against the PR's current head, without needing a new push.
# This job never checks out the PR's own code or workflow definitions: it
# only reads PR metadata via the API and dispatches the two target
# workflows (always their trusted main-branch copies, workflow_dispatch
# requires that) with the PR number as an input. Those workflows do the
# actual code checkout themselves, against refs/pull/<n>/head.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  dispatch:
    name: Dispatch checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/run-checks') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - name: Acknowledge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content='+1' --silent

      - name: Trigger PR Validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pull-request-validation.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f pr_number="${{ github.event.issue.number }}"

      - name: Trigger MegaLinter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run mega-linter.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f pr_number="${{ github.event.issue.number }}"
