---
name: Bot Auto Merge

# Supplies the approving review that lets a dependency bump merge unattended.
# Nothing else: the tests are proven by `Tests Verified`, which
# integration-tests.yml publishes on its own for these pull requests, and the
# merge itself is GitHub's, armed either by Renovate (platformAutomerge) or by
# the last step here on the Dependabot path, because Dependabot cannot arm it.
#
# Why an approval has to be supplied at all: branch protection requires one, and
# `main` no longer requires it to come from a code owner, because CODEOWNERS
# accepts only users and teams. No bot can ever satisfy a code owner rule, so
# with that rule on, a dependency bump could not merge without a person or a
# stored credential belonging to one. The rule was excluding nothing else, since
# an approving review only counts from an account with write access and this
# repository has exactly one. See docs/CONTRIBUTING.md for the consequence: if a
# second write collaborator is ever added, that stops being true and this
# arrangement has to be revisited.
#
# pull_request_target, not pull_request, and the difference is the whole
# defense. Under `pull_request` this file would be read from the pull request's
# own merge commit, so a bump that reached workflow files could delete the
# wait for `Pin Only` below and approve itself, and Renovate does maintain pins
# in .github/workflows/. pull_request_target runs the default branch's copy
# instead. It is normally the more dangerous of the two because it hands a write
# token to a workflow a fork can trigger, which does not apply here: this job
# never checks out the pull request, and the author condition it is gated on
# comes from the immutable copy.
on:
  # zizmor: ignore[dangerous-triggers]
  #
  # Flagged by default, and the reasoning above is why it stays. The checkout
  # below is pinned to the base branch, and the only thing read from the pull
  # request is its diff, as data, on stdin.
  # `labeled` is here because the approval below is gated on the `automerge`
  # label, and Renovate applies that label as part of the same update that
  # pushes the branch. The push event therefore carries a payload with no label
  # on it yet, the decide step reads it as "Renovate is not asking for this to
  # merge", and the pull request sits approved by nobody. Observed on #55:
  # `HAS_AUTOMERGE_LABEL: false` on the synchronize event, label present on the
  # pull request seconds later. The label arriving is now its own trigger.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
  # For the `approve-owner` job below only. `Review Verified` is realistically
  # the slowest of the six required contexts, since it waits on CodeRabbit's
  # own review, and `pull_request_target` never fires again once a pull
  # request stops changing. Without a second trigger, a pull request whose
  # review finished after the first poll window closed would need a push it
  # did not otherwise need, purely to get approved.
  #
  # `workflow_run`, not `status`: coderabbit-gate.yml publishes
  # `Review Verified` with `secrets.GITHUB_TOKEN`, and GitHub does not start
  # new workflow runs from events a `GITHUB_TOKEN` creates, so a `status`
  # trigger would never fire from that publish at all, silently.
  # `workflow_run` reacts to the run finishing rather than to the API call
  # made during it, which is why it is the sanctioned way to chain workflows
  # without a personal access token.
  workflow_run:
    workflows: ["CodeRabbit Gate"]
    types: [completed]
  # The recovery lever, for the `resolve-bot`/`approve` jobs below only.
  # Neither `pull_request_target` above fires again once a pull request stops
  # changing, so a bot pull request that was already open when this file's own
  # decision changed has no future event left to earn an approval from. #94
  # and #136 were both stranded exactly that way; #136 was only recovered by
  # closing and reopening it, which is a clumsy lever to ask of a maintainer.
  #
  # `pr_number` follows pull-request-validation.yml's own workflow_dispatch
  # shape: optional, so leaving it blank re-checks every open Dependabot or
  # Renovate pull request instead of one. It is validated as digits-only in
  # `resolve-bot` below before it ever reaches an API path, since this is free
  # text a maintainer types by hand, unlike github.event.pull_request.number,
  # which GitHub has already parsed for us.
  #checkov:skip=CKV_GHA_7:workflow_dispatch itself requires write access to
  # trigger at all (GitHub platform-level gate, not something this file
  # controls); pr_number never selects a checkout ref or anything else that
  # runs, unlike pull-request-validation.yml's own input, since the checkout
  # below always resolves to the default branch. It only ever selects which
  # pull request a read-only `gh api` lookup and, if the decision below
  # approves, `gh pr review`/`gh pr merge --auto` act on, matched against
  # digits before either happens.
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          Pull request number to re-run the approval decision for. Leave
          blank to check every open Dependabot or Renovate pull request.
        required: false

# The floor. Each job widens it for itself.
permissions:
  contents: read

jobs:
  resolve-bot:
    name: Find the bot pull request(s) to check
    # Not `workflow_run`: that trigger exists for `resolve-owner`/
    # `approve-owner` below only, and this job's case statement has no branch
    # for it. Excluded here rather than given a no-op branch, so an
    # unhandled-event failure below stays meaningful if this file ever grows
    # another trigger nobody taught this job about.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      # A JSON array of {pr_number}, the same shape resolve-owner below
      # already outputs and for the same reason: the approve job re-reads
      # each pull request fresh from the number, so nothing else is worth
      # carrying through the matrix.
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build the list of bot pull requests to check
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request_target)
              # Read straight off the immutable payload: cheap, and this is
              # the same trust boundary this job's own predecessor already
              # relied on. user.login is set by GitHub from the authenticated
              # author, so a pull request cannot claim to be a bot. Exact
              # equality, not startsWith or contains: `renovate[bot]-x` is a
              # login somebody may register, and the non-fork condition is the
              # second half of the same fence, since reaching this any other
              # way would take write access to this repository.
              #
              # The label condition is about noise rather than correctness.
              # `labeled` fires once per label, Renovate applies three, and
              # with `opened` as well #61 collected seven identical approvals
              # before anything had even run. Only the label actually read
              # below is worth waking this for.
              if [ "$IS_FORK" = "false" ] \
                && { [ "$PR_AUTHOR" = "renovate[bot]" ] || [ "$PR_AUTHOR" = "dependabot[bot]" ]; } \
                && { [ "$EVENT_ACTION" != "labeled" ] || [ "$LABEL_NAME" = "automerge" ]; }; then
                matrix=$(jq -nc --arg n "$PR_NUMBER" '[{pr_number: ($n | tonumber)}]')
              else
                matrix='[]'
              fi
              ;;

            workflow_dispatch)
              if [ -n "$INPUT_PR_NUMBER" ]; then
                # Digits only, checked before this ever reaches an API path
                # below: unlike github.event.pull_request.number, which
                # GitHub has already parsed for us, a workflow_dispatch input
                # is free text a maintainer types by hand.
                if ! [[ "$INPUT_PR_NUMBER" =~ ^[0-9]+$ ]]; then
                  echo "::error::pr_number must be digits only, got '$INPUT_PR_NUMBER'."
                  exit 1
                fi
                matrix=$(jq -nc --arg n "$INPUT_PR_NUMBER" '[{pr_number: ($n | tonumber)}]')
              else
                # The REST list endpoint, not `gh pr list`: its GraphQL-backed
                # --json author reports a bot's login as "app/dependabot", not
                # the "dependabot[bot]" shape every other author check in this
                # file compares against, confirmed live against this
                # repository's own open pull requests. REST's `.user.login`
                # matches what github.event.pull_request.user.login reports on
                # the pull_request_target path above, so both triggers agree
                # on what a bot's login looks like.
                matrix=$(gh api "repos/$REPO/pulls?state=open&per_page=100" \
                  --jq '[.[] | select((.user.login == "renovate[bot]" or .user.login == "dependabot[bot]")
                                  and .head.repo.fork == false)
                          | {pr_number: .number}]')
              fi
              ;;

            *)
              echo "::error::Unhandled event: $EVENT_NAME"
              exit 1
              ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Checking: $matrix"

  approve:
    name: Approve and enable auto-merge
    needs: resolve-bot
    # An empty array is not an error: nothing resolved to check, and nothing
    # to approve. `fromJson('[]')` still starts a matrix with zero jobs, which
    # reports as success on its own with no step of this job ever running,
    # the same reasoning approve-owner below already relies on.
    #
    # `resolve-bot.result == 'success'` matters as much as the matrix check:
    # resolve-bot is deliberately skipped on `workflow_run` above, and a
    # custom `if:` here opts this job out of GitHub's own implicit
    # "needs succeeded" gate, so a skipped predecessor is not screened out on
    # its own. Without this, `needs.resolve-bot.outputs.matrix` reads as
    # empty rather than `'[]'` for a skipped run, `!= '[]'` is still true, and
    # `fromJson('')` below would fail the job outright on every `workflow_run`
    # trigger.
    if: needs.resolve-bot.result == 'success' && needs.resolve-bot.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.resolve-bot.outputs.matrix) }}
    # One at a time per pull request. The guard in the Approve step below
    # reads the reviews and then writes one, so two runs racing between those
    # two steps would both see no approval and both add one, which is the
    # pile-up this is meant to end. Queued rather than cancelled: a
    # superseded run here has nothing to redo, but a cancelled one might have
    # been the only run that would have approved.
    concurrency:
      group: bot-auto-merge-${{ matrix.entry.pr_number }}
      cancel-in-progress: false
    permissions:
      # For `gh pr merge --auto` on the Dependabot path only. Arming auto-merge
      # does not merge anything: every required check still has to pass, and
      # `Tests Verified` is absent until the suite proves this commit.
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          # The repository's default branch, not
          # github.event.pull_request.base.ref: that context is absent on
          # workflow_dispatch, and every trigger this job runs under targets
          # `main` as the base anyway (see the pull_request_target filter
          # above), so this is not a behavior change on that path.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Read the pull request's metadata
        # Stands in for github.event.pull_request.* everywhere below, since
        # that context only exists on the pull_request_target path;
        # workflow_dispatch carries nothing but the number resolve-bot put in
        # the matrix. Read fresh from the API on every trigger rather than
        # branching per event, the same choice coderabbit-gate.yml's grade job
        # makes for the same reason: one source of truth for what this pull
        # request currently looks like, not two that can disagree.
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.entry.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR_NUMBER" | jq -r '
            "author=" + .user.login,
            "html_url=" + .html_url,
            "head_sha=" + .head.sha,
            "has_automerge_label=" + ([.labels[].name] | any(. == "automerge") | tostring)
          ' >> "$GITHUB_OUTPUT"

      - name: Wait for the published pin-only verdict
        # The check that keeps "approve on the strength of the author" from
        # meaning "the bot identity has write access to main". Read here
        # instead of run: coderabbit-gate.yml publishes the `Pin Only` status
        # from the same script, scripts/assert-pin-only-diff.py, on the same
        # `pull_request_target` events this job fires on, so computing it a
        # second time here would only be able to drift from the copy the merge
        # queue and the CodeRabbit gate both already read.
        #
        # Polled rather than assumed present, because both workflows are woken
        # by the same event with no ordering guarantee between them: this job
        # can reach this step before the gate's run has published anything at
        # all. An absent status is not a pass, so the loop below waits for one
        # to exist and fails closed if it never does, rather than reading a
        # missing status as "nothing to object to".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 24); do
            result=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
              --jq '[.statuses[] | select(.context == "Pin Only")] | first | {state, description} | @json' \
              || echo "")
            if [ -n "$result" ]; then
              state=$(printf '%s' "$result" | jq -r '.state')
              if [ "$state" != "pending" ]; then
                echo "Pin Only: $(printf '%s' "$result" | jq -r '.description') ($state)"
                [ "$state" = "success" ]
                exit $?
              fi
            fi
            sleep 5
          done
          echo "::error::No settled Pin Only verdict for $HEAD_SHA after two minutes."
          exit 1

      - name: Synthesize a pull_request event payload
        # dependabot/fetch-metadata reads github.event.pull_request straight
        # off the event payload file and throws "Event payload missing
        # `pull_request` key" when it is absent, confirmed by reading its
        # source (dist/index.js): getMessage, getBranchNames, getBody and
        # getTitle all destructure context.payload.pull_request with no other
        # fallback. workflow_dispatch carries no such key. The REST pull
        # request resource read above has the same shape as the webhook
        # payload the action expects, which is what makes wrapping it in
        # {"pull_request": ...} and pointing GITHUB_EVENT_PATH at it for the
        # next step a substitution the action cannot tell apart from the real
        # thing.
        if: github.event_name == 'workflow_dispatch' && steps.pr.outputs.author == 'dependabot[bot]'
        id: synth_event
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.entry.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/pr-$PR_NUMBER-event.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER" | jq '{pull_request: .}' > "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Fetch Dependabot metadata
        id: metadata
        if: steps.pr.outputs.author == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        env:
          # The real event payload on pull_request_target; the synthetic one
          # from the step above on workflow_dispatch, which carries no
          # pull_request key of its own. github.event_path, not a bare
          # $GITHUB_EVENT_PATH default: this workflow never sets that variable
          # itself, so there is no runner default to fall back on other than
          # the one GitHub already exposes through this context.
          GITHUB_EVENT_PATH: ${{ github.event_name == 'workflow_dispatch' && steps.synth_event.outputs.path || github.event_path }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this bump may merge unattended
        # One decision, one place. The steps below read its outputs rather than
        # restating the condition, which is what went wrong before: the same
        # expression was written out twice, both copies compared the ecosystem
        # to a hyphenated name that fetch-metadata never emits (it reports
        # "pre_commit", confirmed live), and all ten pull requests from the
        # first run silently skipped both steps, none flagged as a failure
        # since a skipped step is not an error.
        #
        # Renovate is asked by label, not by update type. It already decides
        # which of its own pull requests may automerge, in
        # .github/renovate.json5, and the rule that grants it also adds the
        # `automerge` label. Restating the update types here would be a second
        # copy of that policy, free to drift from the one Renovate acts on.
        # A major bump therefore arrives with no label, gets no approval, and
        # waits.
        #
        # Dependabot has no such config, so its update type is read from the
        # metadata action. All three of its ecosystems are eligible, test
        # requirements included: they only reach the test virtualenv, and the
        # suite is what clears them either way.
        #
        # `update-type` is blank for a grouped update (#94, "bump the
        # test-dependencies group ... with 2 updates"): confirmed live from
        # that pull request's own run, fetch-metadata has no single semver
        # level to report for more than one dependency, and this
        # organization's every repository groups its pre-commit and
        # github-actions ecosystems with `patterns: ["*"]`, so a grouped bump
        # is the normal shape, not an edge case, and the patch-or-minor branch
        # below had been permanently unreachable for Dependabot.
        # `updated-dependencies-json` is the fallback fetch-metadata itself
        # documents for exactly this: one entry per dependency, each carrying
        # its own updateType, so the group is approved only when every single
        # entry is itself a patch or minor bump; a group hiding even one major
        # still waits for review. #94 stays unapproved even with this fix in
        # place: it is a pip "permit the latest version" style update whose
        # commit message states no prior version for either dependency, so
        # fetch-metadata cannot compute an update type for either entry at all
        # (each reports "" confirmed live), and the fallback below correctly
        # reads that as unresolved rather than as a bump it can vouch for.
        id: decide
        env:
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          HAS_AUTOMERGE_LABEL: ${{ steps.pr.outputs.has_automerge_label }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          UPDATED_DEPENDENCIES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          approve=false
          arm=false

          case "$PR_AUTHOR" in
            "renovate[bot]")
              if [ "$HAS_AUTOMERGE_LABEL" = "true" ]; then
                approve=true
              else
                echo "::notice::No automerge label, so Renovate is not asking for this to merge on its own."
              fi
              ;;
            "dependabot[bot]")
              case "$UPDATE_TYPE" in
                version-update:semver-patch | version-update:semver-minor)
                  approve=true
                  # Dependabot cannot arm auto-merge itself, unlike Renovate.
                  arm=true
                  ;;
                "")
                  # A grouped update: fall back to updated-dependencies-json
                  # and require every dependency in it to be a patch or minor
                  # bump on its own. Piped in on stdin rather than
                  # interpolated into the jq program text, so nothing about a
                  # dependency's name or version is ever read as jq syntax.
                  #
                  # shellcheck disable=SC2016
                  result=$(printf '%s' "$UPDATED_DEPENDENCIES_JSON" | jq -r '
                      def ok: . == "version-update:semver-patch" or . == "version-update:semver-minor";
                      if (type != "array") or length == 0 then
                        "false\tno updated-dependencies-json to fall back on"
                      else
                        ([.[].updateType | if . == "" or . == null then "unknown" else . end]) as $types
                        | if ($types | all(ok)) then
                            "true\tevery dependency in the group is a patch or minor bump (\($types | join(", ")))"
                          else
                            "false\tnot every dependency in the group is a patch or minor bump (\($types | join(", ")))"
                          end
                      end
                    ' 2>/dev/null || echo "")
                  if [ -z "$result" ]; then
                    result="false"$'\t'"updated-dependencies-json was empty or could not be parsed as JSON"
                  fi
                  IFS=$'\t' read -r group_ok group_reason <<< "$result"
                  if [ "$group_ok" = "true" ]; then
                    approve=true
                    # Dependabot cannot arm auto-merge itself, unlike Renovate.
                    arm=true
                    echo "::notice::Update type is blank (a grouped update); $group_reason."
                  else
                    echo "::notice::Update type is blank (a grouped update), and $group_reason, so it waits for review."
                  fi
                  ;;
                *)
                  echo "::notice::Update type ${UPDATE_TYPE:-unknown} is not a patch or minor bump, so it waits for review."
                  ;;
              esac
              ;;
          esac

          echo "approve=$approve" >> "$GITHUB_OUTPUT"
          echo "arm=$arm" >> "$GITHUB_OUTPUT"

      - name: Approve
        if: steps.decide.outputs.approve == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.html_url }}
          PR_NUMBER: ${{ matrix.entry.pr_number }}
          REPO: ${{ github.repository }}
        # Re-approved on every push, which is required rather than wasteful:
        # branch protection dismisses stale reviews, so a rebase drops the
        # previous approval, and `synchronize` is above for that reason.
        #
        # Skipped when a live approval is already there, which is what stops the
        # remaining events piling identical reviews onto one pull request. A
        # dismissed one does not count, so a rebase still earns a fresh
        # approval, which is the whole point of re-running.
        shell: bash
        run: |
          set -euo pipefail
          # --paginate, because the REST reviews endpoint returns one page and
          # #61 had already collected seven reviews before this guard existed.
          # The jq runs per page under --paginate, so the slurp happens outside
          # it: `gh api` refuses --slurp and --jq together.
          existing=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            | jq -s '[.[][] | select(.user.login == "github-actions[bot]" and .state == "APPROVED")] | length')
          if [ "$existing" -gt 0 ]; then
            echo "Already approved and not dismissed. Nothing to do."
            exit 0
          fi
          gh pr review --approve "$PR_URL"

      - name: Enable auto-merge
        # With a merge queue on `main`, this still only arms auto-merge; it
        # does not merge anything itself. GitHub adds the pull request to the
        # queue on its own once every required check, this one included, is
        # green, the same as it does for Renovate's own platformAutomerge.
        if: steps.decide.outputs.arm == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

  resolve-owner:
    name: Find the owner's pull request to approve
    # Not `workflow_dispatch`: that trigger exists for the bot path above
    # only, and this job's case statement below has no branch for it. The
    # recovery lever is for a stranded bot pull request; the owner's own
    # already has `workflow_run` re-running this on every CodeRabbit Gate
    # completion, so there is nothing here for a manual dispatch to recover.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      # A JSON array of {pr_number}. Deliberately just the number: unlike
      # coderabbit-gate.yml's resolve job, nothing here is graded against a
      # merge queue's temporary commit, so there is no separate head/target
      # SHA to carry, and the approve job re-reads the pull request fresh
      # from the number anyway.
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build the list of owner pull requests to check
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request_target)
              # Read straight off the immutable payload: cheap, and this is
              # the same trust boundary the bot job's own `if:` already
              # relies on.
              if [ "$PR_AUTHOR" = "ivan-pinatti" ] && [ "$IS_FORK" != "true" ]; then
                matrix=$(jq -nc --arg n "$PR_NUMBER" '[{pr_number: ($n | tonumber)}]')
              else
                matrix='[]'
              fi
              ;;

            workflow_run)
              # Not narrowed to the one pull request coderabbit-gate.yml
              # happened to grade in the run that just completed:
              # `workflow_run.pull_requests` is only populated for the plain
              # `pull_request` event, and coderabbit-gate.yml never uses it,
              # so there is nothing reliable to narrow by. Re-checking every
              # open owner authored pull request instead is cheap, since
              # this repository only ever has a handful open, and it costs
              # nothing extra to a pull request that is already approved:
              # the Approve step below already dedupes.
              matrix=$(gh pr list --repo "$REPO" --state open --limit 100 \
                --json number,author,isCrossRepository \
                --jq '[.[] | select(.author.login == "ivan-pinatti"
                                and .isCrossRepository == false)
                        | {pr_number: .number}]')
              ;;

            *)
              echo "::error::Unhandled event: $EVENT_NAME"
              exit 1
              ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Checking: $matrix"

  approve-owner:
    name: Approve the owner's own pull request
    needs: resolve-owner
    # An empty array is not an error: nothing to check in, and nothing to
    # approve. `fromJson('[]')` still starts a matrix with zero jobs, which
    # reports as success on its own with no step of this job ever running.
    #
    # `resolve-owner.result == 'success'` matters as much as the matrix check:
    # resolve-owner is now deliberately skipped on `workflow_dispatch` above,
    # and a custom `if:` here opts this job out of GitHub's own implicit
    # "needs succeeded" gate, so a skipped predecessor is not screened out on
    # its own. Without this, `needs.resolve-owner.outputs.matrix` reads as
    # empty rather than `'[]'` for a skipped run, `!= '[]'` is still true, and
    # `fromJson('')` below would fail this job outright on every manual
    # dispatch of the bot recovery lever.
    if: needs.resolve-owner.result == 'success' && needs.resolve-owner.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.resolve-owner.outputs.matrix) }}
    # Keyed on the pull request, not the workflow run, for the same reason
    # coderabbit-gate.yml's grade job is: two triggers racing to approve the
    # same pull request is exactly what this serializes, and the dedupe
    # inside the Approve step below is what stops either of them piling up a
    # second review once the first lands. Queued rather than cancelled: a
    # superseded run has nothing to redo, but a cancelled one might have
    # been the only run that would have approved.
    concurrency:
      group: bot-auto-merge-owner-${{ matrix.entry.pr_number }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Read the pull request's URL
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.entry.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          url=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.html_url')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Wait for every required context to be green
        # Every required context, not just `Pin Only` the way the bot job
        # waits: `Pre-commit`, `Tests`, `Pin Only` and `Review Verified` all
        # have to read green before this job approves anything, because an
        # approval issued before `Review Verified` settles would hand the
        # owner a merge path around the CodeRabbit gate, which is the exact
        # hole docker-torrent-box-with-vpn's #114 was about, and the owner is
        # the one author who can never be asked to supply that review
        # themselves.
        #
        # `statusCheckRollup`, not the `/commits/{sha}/status` endpoint the
        # bot job's wait step reads, because two of the four required
        # contexts here, `Pre-commit` and `Tests`, are ordinary GitHub Checks
        # (workflow jobs), not commit statuses, and that endpoint only ever
        # returns the latter. `statusCheckRollup` is the one place both
        # shapes show up together, the same reasoning
        # coderabbit-review-queue.yml already relies on for the same reason.
        #
        # A two minute window is still not a guarantee `Review Verified`
        # settles inside it, since it depends on CodeRabbit's own review
        # completing. What makes that survivable rather than a dead end is
        # the `workflow_run` trigger above: every time coderabbit-gate.yml
        # finishes a run, this job runs again and re-reads the rollup fresh,
        # rather than depending on this one poll window catching the change
        # or on someone pushing a pull request that has nothing left to
        # change.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.entry.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          required='["Code Check","Prerequisite Checks","Detect Changed Paths","Tests Verified","Pin Only","Review Verified"]'
          for _ in $(seq 1 24); do
            # $owner, $name and $number below are GraphQL query variables,
            # not shell expansions; they are meant to stay literal inside
            # the single-quoted query and are bound by the -f/-F arguments
            # that follow it.
            # shellcheck disable=SC2016
            contexts=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    commits(last: 1) {
                      nodes {
                        commit {
                          statusCheckRollup {
                            contexts(first: 50) {
                              nodes {
                                ... on StatusContext { context state }
                                ... on CheckRun { name conclusion }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F number="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.commits.nodes[0].commit
                    .statusCheckRollup.contexts.nodes // []')

            # A CheckRun can pass as `neutral` or `skipped` as well as
            # `success`; a StatusContext never reports either, so widening
            # the accepted set costs nothing here and matches what branch
            # protection itself treats as a passing required check.
            # shellcheck disable=SC2016
            all_green=$(printf '%s' "$contexts" | jq --argjson required "$required" '
              (map({(.context // .name):
                    ((.state // .conclusion // "pending") | ascii_downcase)})
                | add // {}) as $states
              | (["success", "neutral", "skipped"]) as $passing
              | ($required
                  | map(select(($states[.] // "absent") as $s
                      | ($passing | index($s)) | not))
                  | length) == 0')

            if [ "$all_green" = "true" ]; then
              echo "All required contexts are green for #$PR_NUMBER."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Not every required context is green for #$PR_NUMBER."
          exit 1

      - name: Approve
        # No decide step here, unlike the bot job: reaching this point at all
        # already means the author is the owner, the pull request is not a
        # fork's, and every required context is green, which is the entire
        # decision. Deduplicated against an existing approval the same way
        # the bot job is, for the same reason: branch protection dismisses
        # stale reviews on a rebase, so a rebase re-runs this job on a fresh
        # `pull_request_target` event, and re-approving every time would
        # pile up identical reviews the way docker-torrent-box-with-vpn's
        # #61 did before that guard existed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_NUMBER: ${{ matrix.entry.pr_number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            | jq -s '[.[][] | select(.user.login == "github-actions[bot]"
                              and .state == "APPROVED")] | length')
          if [ "$existing" -gt 0 ]; then
            echo "Already approved and not dismissed. Nothing to do."
            exit 0
          fi
          gh pr review --approve "$PR_URL"

        # No "Enable auto-merge" step here, deliberately: the owner decides
        # when to enqueue their own pull request. Supplying the approval is
        # enough to make it queue eligible; arming auto-merge on top of that
        # would remove the "I will check everything is fine, then merge"
        # step the owner explicitly wants to keep for their own work, even
        # though nothing here would stop the owner running `gh pr merge
        # --auto` by hand if they wanted the same convenience Renovate gets.
