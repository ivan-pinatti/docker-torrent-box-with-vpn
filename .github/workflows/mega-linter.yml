---
name: MegaLinter

on:
  pull_request:
    branches:
      - main
  # workflow_dispatch's own pr_number input lets
  # .github/workflows/comment-dispatch.yml re-run this against a PR's
  # current head from a `/run-checks` comment; a plain manual run from the
  # Actions tab (no input) just lints whichever ref it's dispatched on.
  #checkov:skip=CKV_GHA_7:workflow_dispatch itself requires write access to
  # trigger at all (GitHub platform-level gate, not something this file
  # controls); permissions below are contents:read/pull-requests:read only,
  # pr_number only selects a checkout ref, and this workflow is always
  # dispatched from the trusted default-branch copy, never the PR's own
  # (see comment-dispatch.yml).
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to check out and lint
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
          # betterleaks scans commits, and REPOSITORY_BETTERLEAKS_PR_COMMITS_SCAN
          # resolves <target>^..<source>. The default shallow clone (depth 1)
          # has neither ref, so the secret scan would silently cover nothing.
          fetch-depth: 0

      - name: MegaLinter
        uses: oxsecurity/megalinter@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
