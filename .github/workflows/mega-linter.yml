---
name: MegaLinter
run-name: "MegaLinter for #${{ inputs.pr_number }}"

on:
  # Comment-gated only, dispatched by .github/workflows/comment-dispatch.yml
  # from a `/run-megalinter` comment, itself gated on pr_check (pre-commit)
  # having already passed for the PR's current head commit. No pull_request
  # trigger: this never runs automatically on a plain push.
  #checkov:skip=CKV_GHA_7:workflow_dispatch itself requires write access to
  # trigger at all (GitHub platform-level gate, not something this file
  # controls); permissions below are contents:read/pull-requests:write
  # only, pr_number only selects a checkout ref, and this workflow is
  # always dispatched from the trusted default-branch copy, never the PR's
  # own (see comment-dispatch.yml).
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to check out and lint
        required: true

permissions:
  contents: read
  # write, not just read: MegaLinter's own GitHub Comment Reporter posts its
  # findings as a PR comment, confirmed live to 403 without this.
  pull-requests: write

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          # betterleaks scans commits, and REPOSITORY_BETTERLEAKS_PR_COMMITS_SCAN
          # resolves <target>^..<source>. The default shallow clone (depth 1)
          # has neither ref, so the secret scan would silently cover nothing.
          fetch-depth: 0

      - name: MegaLinter
        uses: oxsecurity/megalinter@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # betterleaks' own git invocation runs in a context that doesn't
          # pick up a `git config --global` write, confirmed live: neither
          # MegaLinter's own automatic safe.directory setup nor this
          # workflow's own PRE_COMMANDS one prevented "detected dubious
          # ownership" from betterleaks specifically. GIT_CONFIG_* env vars
          # apply to any git subprocess that reads the environment,
          # regardless of which $HOME/gitconfig file it would otherwise use.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
