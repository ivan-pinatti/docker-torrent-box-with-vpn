name: PR Validation
on:
  pull_request:
    branches:
      - main
    # `labeled` is what lets the integration job run as a real pull_request
    # check. A workflow_dispatch run is dispatched off main, so its check
    # attaches to main's HEAD rather than the pull request's, and a required
    # status check is evaluated against the pull request's head commit: the
    # tests would pass and the pull request would stay blocked anyway. Adding
    # the `run-tests` label fires this event against the right commit.
    #
    # Naming any type replaces the default set, so the three defaults are
    # restated here rather than inherited.
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  # Lets .github/workflows/comment-dispatch.yml re-run this against a PR's
  # current head from a `/run-check` comment, without needing a new push. Always dispatched off main (see that workflow), so
  # this definition is never taken from the PR's own, potentially-modified
  # copy; pr_number only controls which commit gets checked out below.
  # job_scope narrows which jobs actually run for that comment: `/run-check`
  # wants pr_check (pre-commit) and the MegaLinter job that follows it. There is
  # no comment for the suite, which is started by the `run-tests` label instead
  # (see comment-dispatch.yml for why a comment cannot), so the `tests` scope is
  # left for a manual run from the Actions tab only. A plain manual run (job_scope
  # left as "all") behaves like a normal pull_request-triggered run, except
  # that it also runs the suite, which an unlabelled pull_request does not.
  #checkov:skip=CKV_GHA_7:workflow_dispatch itself requires write access to
  # trigger at all (GitHub platform-level gate, not something this file
  # controls); permissions below are contents:read only, pr_number only
  # selects a checkout ref, and this workflow is always dispatched from the
  # trusted default-branch copy, never the PR's own (see
  # comment-dispatch.yml).
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to check out and validate
        required: true
      job_scope:
        description: "Which jobs to run: all, checks, or tests"
        required: false
        default: all

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed files through the REST API on
  # pull_request events rather than diffing locally, so the changes job cannot
  # publish its output without this.
  pull-requests: read

# A push supersedes whatever is still running for the same PR, so a rapid
# series of pushes does not leave several full validations racing each other
# to an answer that no longer matters. The Integration Suite job is the reason
# this matters: it spins the whole stack up, and a superseded copy of it will
# happily run for twenty minutes describing a commit nobody is looking at.
# Keyed on the PR number where there is one, falling back to the ref so a
# workflow_dispatch run gets its own group instead of cancelling a real one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_check:
    name: Code Check
    runs-on: ubuntu-latest
    # A cold pre-commit cache (no run has populated it yet, or a hook
    # version bumped) needs real time to install every hook's own
    # environment before it can check a single file; confirmed live, that
    # alone took about 2 minutes on a completely cold cache. 3 minutes was
    # never enough even ignoring that.
    timeout-minutes: 8
    if: github.event_name != 'workflow_dispatch' || inputs.job_scope != 'tests'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Install shfmt
        # The jumanjihouse/pre-commit-hooks shfmt wrapper expects shfmt
        # already on PATH; it doesn't install its own copy the way the
        # Python/Node-based hooks do. ubuntu-latest doesn't ship it.
        shell: bash
        run: |
          curl -sSL -o shfmt \
            https://github.com/mvdan/sh/releases/download/v3.11.0/shfmt_v3.11.0_linux_amd64
          echo "1904ec6bac715c1d05cd7f6612eec8f67a625c3749cb327e5bfb4127d09035ff  shfmt" | sha256sum --check
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/shfmt

      - name: Create .env file
        shell: bash
        run: cp .env.example .env

      - name: Read PYTHON_VERSION from .env
        shell: bash
        run: grep -m1 '^PYTHON_VERSION=' .env >> "$GITHUB_ENV"

      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pre-commit Run
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
        env:
          # .pre-commit-config.yaml runs megalinter-incremental at the
          # pre-commit stage, which under --all-files is the same sweep the
          # MegaLinter workflow already performs on the same commit. Both took
          # very nearly four minutes, doing identical work and reporting the
          # same failures twice. The standalone workflow keeps it, since that
          # is the one with the reporter output and the uploaded artifacts;
          # this job drops it and is left checking what only pre-commit checks.
          SKIP: megalinter-incremental

  prerequisites:
    name: Prerequisite Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch' || inputs.job_scope != 'checks'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Install xmlstarlet
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet

      - name: Set up rootless Podman
        # ubuntu-latest ships Podman's binaries but doesn't delegate any
        # subuid/subgid range to the runner user, so podman info hangs
        # rather than reporting a real daemon, confirmed live. This is the
        # runtime the project is actually built and documented for (see
        # docs/PODMAN.md); every local bench validation this session ran
        # on Podman, not Docker. podman-compose (not podman's own built-in
        # compose subcommand, which falls back to whichever compose
        # implementation it finds first, possibly Docker's own) matches
        # the Makefile's own COMPOSE resolution for local dev exactly.
        shell: bash
        run: |
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(whoami)"
          podman system migrate
          podman info
          # Pinned so a release of podman-compose cannot change what CI tests
          # without anything in this repository changing. That is the whole
          # claim: it is reproducibility, not a fix.
          #
          # It was written while chasing the `up --detach` hang that started
          # when the ubuntu-latest image went from podman 4.9.3 (image
          # 20260707.563) to 5.8.4 (20260729.566), on the theory that
          # podman-compose 1.6.0 was the culprit. It is not: 1.5.0 hangs in
          # exactly the same place, at the same point in the output, so the
          # version installed here is ruled out and podman itself is not.
          pip install podman-compose==1.5.0

      - name: Create .env file
        shell: bash
        run: cp .env.example .env

      - name: Read PYTHON_VERSION from .env
        shell: bash
        run: grep -m1 '^PYTHON_VERSION=' .env >> "$GITHUB_ENV"

      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create test venv and run prerequisite tests
        run: make test_prerequisites

  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Was its own workflow, which meant it ran alongside pre-commit rather than
    # after it: a change that fails a pre-commit hook still spent ~4 minutes of
    # runner time being told the same thing twice, in a different format. As a
    # job it can wait for that answer. It is the slower and broader of the two
    # lint layers, so it only makes sense to spend it once the fast one agrees.
    needs: [pr_check]
    if: >-
      ${{ (github.event_name != 'workflow_dispatch' || inputs.job_scope != 'tests')
      && needs.pr_check.result == 'success' }}
    permissions:
      contents: read
      # write, not just read: MegaLinter's own GitHub Comment Reporter posts its
      # findings as a PR comment, confirmed live to 403 without this. The
      # workflow's own default is pull-requests: read, for the paths filter.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
          # betterleaks scans commits, and REPOSITORY_BETTERLEAKS_PR_COMMITS_SCAN
          # resolves <target>^..<source>. The default shallow clone (depth 1)
          # has neither ref, so the secret scan would silently cover nothing.
          fetch-depth: 0

      - name: MegaLinter
        # The cupcake flavor, not the default image: 2.64 GB against 4.77 GB,
        # and it carries every linter enabled in .mega-linter.yml. Checked by
        # listing the binaries inside the image rather than trusting the
        # descriptors, which claim a linter with no declared flavors belongs to
        # every flavor and are wrong about it.
        uses: oxsecurity/megalinter/flavors/cupcake@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # betterleaks' own git invocation runs in a context that doesn't
          # pick up a `git config --global` write, confirmed live: neither
          # MegaLinter's own automatic safe.directory setup nor this
          # workflow's own PRE_COMMANDS one prevented "detected dubious
          # ownership" from betterleaks specifically. GIT_CONFIG_* env vars
          # apply to any git subprocess that reads the environment,
          # regardless of which $HOME/gitconfig file it would otherwise use.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"

  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      renovate: ${{ steps.filter.outputs.renovate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Every predicate has to hold for a path to count, not just one of
          # them. The default is `some`, under which `**` alone matches
          # everything and the negations below never get a say, so `code` came
          # out true for a docs-only PR and the filter was decorative.
          # Every predicate has to hold for a path to count, not just one of
          # them. The default is `some`, under which `**` alone matches
          # everything and the negations below never get a say, so `code` came
          # out true for a docs-only PR and the filter was decorative.
          predicate-quantifier: every
          # Anything that can change how the stack behaves at runtime. Read by
          # the integration_required gate, which waives the suite when nothing
          # here changed: a pull request touching only prose cannot break an
          # integration test, and an eleven minute stack run to prove that costs
          # more than the check is worth. Deliberately broad, so it lists what is
          # safe to skip on rather than what to run on.
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!**/.gitkeep'
              - '!CITATION.cff'
            renovate:
              - '.github/renovate.json5'

  renovate_config:
    name: Renovate Config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    # Narrower than the workflow default, which also grants pull-requests:
    # read for dorny/paths-filter in the changes job. This job runs Renovate
    # through npx and has no reason to hold a token that can read PRs.
    permissions:
      contents: read
    # Only when that one file changes. The validator downloads Renovate to run,
    # which is not worth paying for on PRs that cannot have affected it.
    if: >-
      ${{ !cancelled()
      && (needs.changes.outputs.renovate == 'true' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
          # This job downloads and runs Renovate through npx. checkout leaves
          # the token in .git/config by default, where anything it executes
          # could read it. Nothing here talks to git, so drop it.
          persist-credentials: false

      - name: Validate renovate.json5
        shell: bash
        # No file argument on purpose: passing the path explicitly validates it
        # as *global* config, a weaker check that misses repo-only problems.
        # Run bare, the validator finds .github/renovate.json5 itself.
        #
        # --strict is what gives this teeth. A config needing migration is only
        # a WARN by default and the command still exits 0, so without it this
        # job would pass on exactly the drift it exists to catch. Confirmed
        # against the pre-migration file: exit 1 with --strict, 0 without.
        run: npx --yes --package renovate@42.99.0 renovate-config-validator --strict

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # make test_ci (the last step below), not the full make test: see its
    # own comment on that step for why. The two tiers it does run took
    # ~5s and ~5min respectively on this session's own local benches;
    # doubled for image pulls, stack startup, and a slower shared runner.
    # A few extra minutes on top of that cover the wire_connections step
    # (mostly concurrent per-app HTTP calls, with some retries up to 180s).
    timeout-minutes: 25
    needs: [pr_check, prerequisites, megalinter]
    # Runs only once the `run-tests` label is on the pull request, never on an
    # unlabelled push. It stands the whole stack up, and one pull request went
    # through five pushes for a change to a shell hook and its unit tests,
    # spending something like a hundred minutes of runner time on it, twice
    # timing out at 25 minutes before reaching a single test. Nothing in those
    # runs could have been affected by the change.
    #
    # A code owner applies the `run-tests` label directly, which GitHub already
    # restricts to collaborators, so the permission model needs no check of our
    # own. A comment cannot do it: a label applied by a workflow's GITHUB_TOKEN
    # triggers nothing, by design (see comment-dispatch.yml). Once labelled, a further push does re-run this, which is
    # deliberate. A required status check is evaluated against the head commit,
    # so a result from before the last push would not count for the merge even
    # if it were kept.
    #
    # The cost of all this is that a pull request carries no test result at all
    # until someone asks for one.
    #
    # !cancelled() rather than always(): a need being skipped must not skip this
    # too (pr_check and megalinter are both skipped for job_scope: tests, which
    # is the scope a manual tests-only dispatch uses), but a cancelled run must
    # to spend twenty minutes standing the stack up. Only an actual failure of
    # one of the lint layers blocks it.
    if: >-
      ${{ !cancelled()
      && ((github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'run-tests'))
      || (github.event_name == 'workflow_dispatch' && inputs.job_scope != 'checks'))
      && (needs.pr_check.result == 'success' || needs.pr_check.result == 'skipped')
      && (needs.megalinter.result == 'success' || needs.megalinter.result == 'skipped')
      && (needs.prerequisites.result == 'success' || needs.prerequisites.result == 'skipped') }}
    env:
      PROTONVPN_PRIVATE_KEY: ${{ secrets.PROTONVPN_PRIVATE_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
      # To take the label back off again, see the last step.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Install xmlstarlet
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet

      - name: Set up rootless Podman
        # See prerequisites job's own copy of this step for why it's
        # needed. This is the runtime the project is actually built and
        # documented for; every local bench validation this session ran
        # on Podman, not Docker.
        shell: bash
        run: |
          # Reported, because the runner image's podman version is now known to
          # change the suite's answer on its own: 4.9.3 passed, 5.8.4 hangs. It
          # lives in /usr/local/bin, not /usr/bin, which is worth knowing before
          # anyone tries to pin it with apt: that installs to /usr/bin and is
          # silently shadowed, reporting success while changing nothing.
          command -v podman
          podman --version
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(whoami)"
          podman system migrate
          podman info
          # Pinned for the reason spelled out on the prerequisites job's copy:
          # so a release cannot change what CI tests on its own. It does not
          # fix the `up --detach` hang; 1.5.0 hangs the same way 1.6.0 does.
          pip install podman-compose==1.5.0
          # tests/conftest.py's docker_client fixture talks to podman over
          # this exact socket path, not the CLI; nothing starts it by
          # default on ubuntu-latest, confirmed live (every container/auth
          # test errored out at fixture setup with a plain
          # FileNotFoundError on the socket path).
          mkdir -p "/run/user/$(id -u)/podman"
          nohup podman system service --time=0 "unix:///run/user/$(id -u)/podman/podman.sock" >/tmp/podman-service.log 2>&1 &
          timeout 30 bash -c 'until [ -S "/run/user/'"$(id -u)"'/podman/podman.sock" ]; do sleep 1; done'

      - name: Create .env file
        shell: bash
        run: |
          cp .env.example .env
          # make generate_certificate rejects .env.example's own LAN_IP placeholder
          # (OpenSSL needs a real IP for the certificate's subjectAltName); any
          # RFC 1918 address works here since nothing on the runner resolves it.
          sed -i 's/^LAN_IP=192.168.1.x/LAN_IP=192.168.1.100/' .env

      - name: Set up VPN (real key if available, otherwise the local mock)
        shell: bash
        run: |
          if [ -n "${{ env.PROTONVPN_PRIVATE_KEY }}" ]; then
            echo "${{ env.PROTONVPN_PRIVATE_KEY }}" > configs/gluetun/.secret
          else
            # gluetun can't actually be skipped the way GLUETUN_PROFILE=disabled
            # tries to: it's foundational, not optional the way other apps'
            # profiles are, since every VPN-routed container's network_mode
            # depends on it existing. Confirmed live: disabling its profile just
            # makes make start's own explicit `up gluetun` call fail outright
            # ("missing services [gluetun]") under podman-compose, which (unlike
            # Docker Compose) doesn't let an explicitly named service override
            # profile filtering. Point it at this repo's own credential-free
            # mock WireGuard endpoint instead, the same mechanism make
            # bootstrap_tests already uses; see docs/VPN_MOCK.md.
            sed -i 's/^VPN_MOCK_PROFILE=disabled/VPN_MOCK_PROFILE=enabled/' .env
            ./scripts/seed-vpn-mock.sh
          fi

      - name: Read PYTHON_VERSION from .env
        shell: bash
        run: grep -m1 '^PYTHON_VERSION=' .env >> "$GITHUB_ENV"

      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scripts/permissions.py's dependency
        # seed_all's own permissions_repair step runs this script directly
        # with the system Python, not tests/.venv (that only gets created
        # later, by make test's own dependency on it).
        shell: bash
        run: pip install pyyaml

      - name: Seed every app's config and secrets
        # make start alone, unlike make bootstrap, never seeds any of this:
        # every app whose compose service references a secrets.yml or
        # .env.secrets file normally seeded here fails outright the moment
        # that file doesn't exist yet, confirmed live (calibre's own
        # .env.secrets specifically, but this affects every app in the
        # list, not just that one).
        # Bounded because it is not just file seeding: its own
        # configs/flaresolverr/config/chromedriver prerequisite runs a
        # container to extract chromedriver, so this step performs the job's
        # first Docker Hub pull. A run stalled here for over four minutes,
        # having previously stalled in Start stack, which is the same cause
        # wearing a different step name.
        timeout-minutes: 8
        run: make seed_all

      - name: Generate self-signed certificate
        timeout-minutes: 3
        run: make generate_certificate

      - name: Log in to Docker Hub
        # 26 of this stack's images come from Docker Hub, and anonymous pulls
        # are rate limited per source address while GitHub runners share
        # addresses across every project on the pool. Three runs on this pull
        # request stalled mid-pull long enough to hit a timeout, each in a
        # different step, which is the shape throttling makes.
        #
        # podman login rather than docker/login-action: podman is the runtime
        # here and only falls back to ~/.docker/config.json, so this writes the
        # auth file it actually uses.
        #
        # Skipped when the secret is absent, which is every pull request from a
        # fork, since GitHub does not expose secrets to those. They keep pulling
        # anonymously and this must not fail them.
        if: env.DOCKERHUB_USERNAME != ''
        timeout-minutes: 2
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" \
            | podman login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Pull container images
        # Split out of `make start` so the pull is visible and bounded on its
        # own. Three runs on this pull request stalled in `Start stack` for
        # long enough to hit the job's 25 minute cap, and the only thing the
        # log said was "The operation was canceled": with the pull folded into
        # the same step there was no way to tell a slow registry from a
        # container that never comes up.
        timeout-minutes: 12
        run: make pull_docker_images

      - name: Start stack
        # Every long step carries its own timeout. Without them the job-level
        # 25 minutes was the only bound, so a single stuck step burned the
        # whole budget and reported nothing about which one it was. These sum
        # to more than 25 deliberately: the job cap stays the outer bound, and
        # these exist to name the culprit, not to replace it.
        timeout-minutes: 10
        # The step timing out on its own says only that something hung: the log
        # ends on a container name with nothing after it, which is what four
        # runs in a row reported. Interrupting a little before the cap and
        # dumping state instead is what established that the stack does come
        # up (every container `Up`, healthchecks still pending) and that it is
        # `podman-compose up --detach` that never returns.
        shell: bash
        run: |
          rc=0
          timeout --signal=INT 420 make start || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::group::podman ps -a"
            podman ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}' || true
            echo "::endgroup::"
            echo "::group::podman-compose processes"
            pgrep -a -f 'podman|conmon|make' || true
            echo "::endgroup::"
            echo "::error::make start did not finish (exit $rc)."
            exit "$rc"
          fi

      - name: Wait for containers to be ready
        timeout-minutes: 7
        # Reads straight from `podman ps`, not through a compose wrapper:
        # podman's own --format json is a single JSON array with health
        # folded into the free-text Status field ("Up 3 minutes
        # (healthy)"), not a docker compose-style newline-delimited object
        # per container with its own top-level Health key.
        #
        # 300s, not 120s: confirmed live, calibre-web and lidarr both took
        # longer than 120s to report healthy on a runner's shared, more
        # constrained resources than any local bench this session ran on.
        # calibre-web in particular is already known to be slow on first
        # boot; see docs/ROTATION.md.
        shell: bash
        run: |
          timeout 300 bash -c '
            until podman ps --format json 2>/dev/null | \
              python3 -c "
          import sys, json
          containers = json.load(sys.stdin)
          starting = [c[\"Names\"] for c in containers if \"starting\" in c.get(\"Status\", \"\")]
          print(starting); sys.exit(0 if not starting else 1)
          "; do sleep 5; done
          '

      - name: Wire app-to-app connections
        # Homepage's widgets read each app's API key from configs/<app>/secrets/
        # api_key.txt, but Jellyfin and Audiobookshelf issue that key live
        # through their own first-run API (see wire-connections.sh), and never
        # from a seeded default the way the arr apps do. Skipping this step
        # left both widgets, and Calibre-Web's own library path setup, on
        # nothing but a seeded placeholder, confirmed live as the cause of
        # this job's own Homepage widget failures. make bootstrap always runs
        # this straight after make start for the same reason.
        timeout-minutes: 10
        run: make wire_connections

      - name: Run integration tests
        # make test_ci, not make test: the serial rotation/wiring/
        # killswitch tier needs a real app restart to complete and report
        # healthy within its own wait budget, over and over, for dozens
        # of apps in a row, and that isn't reliable on a GitHub-hosted
        # runner's shared, more constrained resources, confirmed live
        # (many failures, "container state improper" among them, despite
        # the exact same suite passing 100% clean twice on a real bench's
        # own hardware the same night). test_ci's own killswitch marker
        # exclusion already covers not having a real VPN key here, same
        # as the make test invocation this replaced did explicitly.
        # make bootstrap_tests (a real bench, pre-release) still runs the
        # full thing, including this tier.
        # The wiring_readonly subset does run here: it reads back what the
        # wire_connections step above just wired, and restarts nothing. See
        # the Makefile's own comment on test_ci.
        timeout-minutes: 12
        run: make test_ci

      - name: Tear down
        if: always()
        timeout-minutes: 5
        run: make stop_all

      - name: Take the label back off
        # The label means "run the suite once, now", so it is consumed rather
        # than left on. Otherwise it lingers on the pull request and starts a
        # twelve minute run again the moment anything fires this workflow:
        # reopening a closed pull request would do it, since the label lives on
        # the pull request rather than the branch and `reopened` is a trigger.
        #
        # Removing it fires `unlabeled`, which is deliberately not a trigger, so
        # this cannot loop. always(), so a failed or cancelled run does not leave
        # the label stuck and unable to be re-applied.
        if: always() && github.event_name == 'pull_request'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --remove-label run-tests || true

  # The required status check, and the only job here named "Integration Tests".
  # The suite itself is "Integration Suite" above.
  #
  # It exists because a job skipped by its own `if` is reported to branch
  # protection as successful. Gating the suite on a label therefore had the
  # exact opposite effect to the one intended: an unlabelled pull request
  # showed Integration Tests satisfied and could be merged having never run a
  # test. This job is never skipped, so the answer never depends on how a skip
  # is interpreted. It is red until the suite has actually passed on this
  # commit, and it costs a couple of seconds.
  integration_required:
    name: Tests Verified
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [integration, changes]
    # Not always(): a cancelled run is superseded by a newer one, and failing
    # here would just report a stale contradiction of it.
    if: ${{ !cancelled() }}
    steps:
      - name: Require the suite to have passed on this commit
        env:
          RESULT: ${{ needs.integration.result }}
          # A draft cannot be merged, so a passing gate on one grants nothing,
          # and a red check for "you have not asked for tests yet" reads as a
          # failure when nothing is broken. Enforcement starts when the pull
          # request is marked ready, which is why ready_for_review is a trigger:
          # without it, marking ready fires no event and a draft's green gate
          # would stand.
          DRAFT: ${{ github.event.pull_request.draft }}
          # Empty unless the changes job both ran and answered, so a skipped or
          # failed filter reads as "not proven docs-only" and the suite is still
          # required. The waiver has to fail closed: it is the one thing here
          # that can let a change merge untested.
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$RESULT" = "success" ]; then
            echo "Integration suite passed on this commit."
            exit 0
          fi

          if [ "$RESULT" = "skipped" ]; then
            # Prose cannot break an integration test, and standing the whole
            # stack up for eleven minutes to prove that costs more than the
            # check is worth.
            #
            # Nested under skipped on purpose. Checked before it, the waiver
            # also swallowed a suite that ran and *failed* on a docs-only pull
            # request, which is a real failure whatever the diff touched. Found
            # by testing the combinations rather than the happy path.
            #
            # Restricted to pull_request because the filter compares against the
            # pull request's base; on any other event there is nothing to
            # compare and the answer would be meaningless.
            if [ "$EVENT" = "pull_request" ] && [ "$CODE_CHANGED" = "false" ]; then
              echo "No runtime files changed, so the integration suite is not required."
              echo "Touching anything outside docs and markdown will require it again."
              exit 0
            fi
            if [ "$DRAFT" = "true" ]; then
              echo "::notice::Still a draft, so the integration suite is not required yet."
              echo "Apply the run-tests label before marking this ready for review."
              exit 0
            fi
            echo "The integration suite has not run on this commit."
            echo "Apply the run-tests label to the pull request to run them."
            exit 1
          fi
          echo "The integration suite did not pass on this commit (result: $RESULT)."
          exit 1
