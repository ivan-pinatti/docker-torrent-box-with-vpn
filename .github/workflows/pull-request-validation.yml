name: PR Validation
on:
  pull_request:
    branches:
      - main
    # The defaults. `labeled` and `ready_for_review` were here for the label
    # mechanism that started the integration suite; that now lives in
    # integration-tests.yml and is triggered by a comment instead.
    types: [opened, synchronize, reopened]
  # Lets .github/workflows/comment-dispatch.yml re-run this against a PR's
  # current head from a `/run-check` comment, without needing a new push. Always dispatched off main (see that workflow), so
  # this definition is never taken from the PR's own, potentially-modified
  # copy; pr_number only controls which commit gets checked out below.
  # job_scope narrows which jobs actually run for that comment: `/run-check`
  # wants pr_check (pre-commit) and the MegaLinter job that follows it. There is
  # no `tests` scope any more: the suite lives in integration-tests.yml and is
  # triggered by a `/run-tests` comment. A plain manual run (job_scope
  # left as "all") behaves like a normal pull_request-triggered run, except
  # that it also runs the suite, which an unlabelled pull_request does not.
  #checkov:skip=CKV_GHA_7:workflow_dispatch itself requires write access to
  # trigger at all (GitHub platform-level gate, not something this file
  # controls); permissions below are contents:read only, pr_number only
  # selects a checkout ref, and this workflow is always dispatched from the
  # trusted default-branch copy, never the PR's own (see
  # comment-dispatch.yml).
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to check out and validate
        required: true
      job_scope:
        description: "Which jobs to run: all, checks, or tests"
        required: false
        default: all

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed files through the REST API on
  # pull_request events rather than diffing locally, so the changes job cannot
  # publish its output without this.
  pull-requests: read

# A push supersedes whatever is still running for the same PR, so a rapid
# series of pushes does not leave several full validations racing each other
# to an answer that no longer matters. The integration suite has its own
# concurrency group in integration-tests.yml for the same reason.
# Keyed on the PR number where there is one, falling back to the ref so a
# workflow_dispatch run gets its own group instead of cancelling a real one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_check:
    name: Code Check
    runs-on: ubuntu-latest
    # A cold pre-commit cache (no run has populated it yet, or a hook
    # version bumped) needs real time to install every hook's own
    # environment before it can check a single file; confirmed live, that
    # alone took about 2 minutes on a completely cold cache. 3 minutes was
    # never enough even ignoring that.
    timeout-minutes: 8
    if: github.event_name != 'workflow_dispatch' || inputs.job_scope != 'tests'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Install shfmt
        # The jumanjihouse/pre-commit-hooks shfmt wrapper expects shfmt
        # already on PATH; it doesn't install its own copy the way the
        # Python/Node-based hooks do. ubuntu-latest doesn't ship it.
        shell: bash
        run: |
          curl -sSL -o shfmt \
            https://github.com/mvdan/sh/releases/download/v3.11.0/shfmt_v3.11.0_linux_amd64
          echo "1904ec6bac715c1d05cd7f6612eec8f67a625c3749cb327e5bfb4127d09035ff  shfmt" | sha256sum --check
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/shfmt

      - name: Create .env file
        shell: bash
        run: cp .env.example .env

      - name: Read PYTHON_VERSION from .env
        shell: bash
        run: grep -m1 '^PYTHON_VERSION=' .env >> "$GITHUB_ENV"

      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pre-commit Run
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
        env:
          # .pre-commit-config.yaml runs megalinter-incremental at the
          # pre-commit stage, which under --all-files is the same sweep the
          # MegaLinter workflow already performs on the same commit. Both took
          # very nearly four minutes, doing identical work and reporting the
          # same failures twice. The standalone workflow keeps it, since that
          # is the one with the reporter output and the uploaded artifacts;
          # this job drops it and is left checking what only pre-commit checks.
          SKIP: megalinter-incremental

  prerequisites:
    name: Prerequisite Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch' || inputs.job_scope != 'checks'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Install xmlstarlet
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet

      - name: Set up rootless Podman
        # ubuntu-latest ships Podman's binaries but doesn't delegate any
        # subuid/subgid range to the runner user, so podman info hangs
        # rather than reporting a real daemon, confirmed live. This is the
        # runtime the project is actually built and documented for (see
        # docs/PODMAN.md); every local bench validation this session ran
        # on Podman, not Docker. podman-compose (not podman's own built-in
        # compose subcommand, which falls back to whichever compose
        # implementation it finds first, possibly Docker's own) matches
        # the Makefile's own COMPOSE resolution for local dev exactly.
        #
        # Deliberately not carrying integration-tests.yml's podman downgrade.
        # That exists because the image's podman cannot run container
        # healthchecks, and this job starts no containers: `make
        # test_prerequisites` is pre-flight checks only. Adding it here would
        # cost every pull request an apt install to change nothing.
        shell: bash
        run: |
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(whoami)"
          podman system migrate
          podman info
          # Pinned to match integration-tests.yml, where the reasoning is: a
          # release of podman-compose should not be able to change what CI tests
          # without a change in this repository. Renovate keeps both in step
          # through the annotation below; see the customManager in
          # .github/renovate.json5.
          # renovate: datasource=pypi depName=podman-compose
          pip install podman-compose==1.5.0

      - name: Create .env file
        shell: bash
        run: cp .env.example .env

      - name: Read PYTHON_VERSION from .env
        shell: bash
        run: grep -m1 '^PYTHON_VERSION=' .env >> "$GITHUB_ENV"

      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create test venv and run prerequisite tests
        run: make test_prerequisites

  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Was its own workflow, which meant it ran alongside pre-commit rather than
    # after it: a change that fails a pre-commit hook still spent ~4 minutes of
    # runner time being told the same thing twice, in a different format. As a
    # job it can wait for that answer. It is the slower and broader of the two
    # lint layers, so it only makes sense to spend it once the fast one agrees.
    needs: [pr_check]
    if: >-
      ${{ (github.event_name != 'workflow_dispatch' || inputs.job_scope != 'tests')
      && needs.pr_check.result == 'success' }}
    permissions:
      contents: read
      # write, not just read: MegaLinter's own GitHub Comment Reporter posts its
      # findings as a PR comment, confirmed live to 403 without this. The
      # workflow's own default is pull-requests: read, for the paths filter.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
          # betterleaks scans commits, and REPOSITORY_BETTERLEAKS_PR_COMMITS_SCAN
          # resolves <target>^..<source>. The default shallow clone (depth 1)
          # has neither ref, so the secret scan would silently cover nothing.
          fetch-depth: 0

      - name: MegaLinter
        # The cupcake flavor, not the default image: 2.64 GB against 4.77 GB,
        # and it carries every linter enabled in .mega-linter.yml. Checked by
        # listing the binaries inside the image rather than trusting the
        # descriptors, which claim a linter with no declared flavors belongs to
        # every flavor and are wrong about it.
        uses: oxsecurity/megalinter/flavors/cupcake@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # betterleaks' own git invocation runs in a context that doesn't
          # pick up a `git config --global` write, confirmed live: neither
          # MegaLinter's own automatic safe.directory setup nor this
          # workflow's own PRE_COMMANDS one prevented "detected dubious
          # ownership" from betterleaks specifically. GIT_CONFIG_* env vars
          # apply to any git subprocess that reads the environment,
          # regardless of which $HOME/gitconfig file it would otherwise use.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"

  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      renovate: ${{ steps.filter.outputs.renovate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Every predicate has to hold for a path to count, not just one of
          # them. The default is `some`, under which `**` alone matches
          # everything and the negations below never get a say, so `code` came
          # out true for a docs-only PR and the filter was decorative.
          # Every predicate has to hold for a path to count, not just one of
          # them. The default is `some`, under which `**` alone matches
          # everything and the negations below never get a say, so `code` came
          # out true for a docs-only PR and the filter was decorative.
          predicate-quantifier: every
          # Anything that can change how the stack behaves at runtime. Read by
          # the docs_only_waiver job, which publishes a passing status when
          # nothing here changed: a pull request touching only prose cannot break an
          # integration test, and an eleven minute stack run to prove that costs
          # more than the check is worth. Deliberately broad, so it lists what is
          # safe to skip on rather than what to run on.
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!**/.gitkeep'
              - '!CITATION.cff'
            renovate:
              - '.github/renovate.json5'

  renovate_config:
    name: Renovate Config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    # Narrower than the workflow default, which also grants pull-requests:
    # read for dorny/paths-filter in the changes job. This job runs Renovate
    # through npx and has no reason to hold a token that can read PRs.
    permissions:
      contents: read
    # Only when that one file changes. The validator downloads Renovate to run,
    # which is not worth paying for on PRs that cannot have affected it.
    if: >-
      ${{ !cancelled()
      && (needs.changes.outputs.renovate == 'true' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
          # This job downloads and runs Renovate through npx. checkout leaves
          # the token in .git/config by default, where anything it executes
          # could read it. Nothing here talks to git, so drop it.
          persist-credentials: false

      - name: Validate renovate.json5
        shell: bash
        # No file argument on purpose: passing the path explicitly validates it
        # as *global* config, a weaker check that misses repo-only problems.
        # Run bare, the validator finds .github/renovate.json5 itself.
        #
        # --strict is what gives this teeth. A config needing migration is only
        # a WARN by default and the command still exits 0, so without it this
        # job would pass on exactly the drift it exists to catch. Confirmed
        # against the pre-migration file: exit 1 with --strict, 0 without.
        run: npx --yes --package renovate@42.99.0 renovate-config-validator --strict

  docs_only_waiver:
    name: Docs Only Waiver
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    # Prose cannot break an integration test, and an eleven minute stack run to
    # prove it costs more than the check is worth. Publishes the same status
    # context the suite does, so a documentation-only pull request satisfies the
    # required check without anyone asking for a run.
    #
    # Only ever publishes success, and only when the filter positively reports
    # no runtime files changed. Anything else, including the filter failing to
    # answer, leaves the context absent, which reads as "expected, waiting" and
    # blocks the merge until someone runs `/run-tests`. A real run overwrites
    # whatever this wrote.
    if: >-
      ${{ !cancelled()
      && github.event_name == 'pull_request'
      && needs.changes.result == 'success'
      && needs.changes.outputs.code == 'false' }}
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Waive the suite for a prose-only change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=success \
            -f context="Tests Verified" \
            -f description="No runtime files changed, so the suite is not required" \
            --silent
