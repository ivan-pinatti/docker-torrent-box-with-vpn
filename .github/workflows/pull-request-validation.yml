name: PR Validation
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pr_check:
    name: Code Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        shell: bash
        run: cp .env.example .env

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.3

      - name: Pre-commit Run
        uses: pre-commit/action@v3.0.0
        with:
          extra_args: --all-files
