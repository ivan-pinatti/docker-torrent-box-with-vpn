name: PR Validation
on:
  pull_request:
    branches:
      - main
  # Lets .github/workflows/comment-dispatch.yml re-run this against a PR's
  # current head from a `/run-check` or `/run-tests` comment, without
  # needing a new push. Always dispatched off main (see that workflow), so
  # this definition is never taken from the PR's own, potentially-modified
  # copy; pr_number only controls which commit gets checked out below.
  # job_scope narrows which jobs actually run for that comment: `/run-check`
  # only wants pr_check (pre-commit; MegaLinter is dispatched separately),
  # `/run-tests` only wants prerequisites + integration. A plain manual run
  # from the Actions tab (job_scope left as "all") behaves like a normal
  # pull_request-triggered run.
  #checkov:skip=CKV_GHA_7:workflow_dispatch itself requires write access to
  # trigger at all (GitHub platform-level gate, not something this file
  # controls); permissions below are contents:read only, pr_number only
  # selects a checkout ref, and this workflow is always dispatched from the
  # trusted default-branch copy, never the PR's own (see
  # comment-dispatch.yml).
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to check out and validate
        required: true
      job_scope:
        description: Which jobs to run — all, checks, or tests
        required: false
        default: all

permissions:
  contents: read

jobs:
  pr_check:
    name: Code Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name != 'workflow_dispatch' || inputs.job_scope != 'tests'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Create .env file
        shell: bash
        run: cp .env.example .env

      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: 3.11.3

      - name: Pre-commit Run
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  prerequisites:
    name: Prerequisite Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch' || inputs.job_scope != 'checks'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Create .env file
        shell: bash
        run: cp .env.example .env

      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: 3.11.3

      - name: Create test venv and run prerequisite tests
        run: make test_prerequisites

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pr_check
    # No implicit success() here (an explicit if: replaces it), since
    # pr_check being skipped for job_scope: tests must not skip this too:
    # only an actual pr_check failure should block it.
    if: >
      (needs.pr_check.result == 'success' || needs.pr_check.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.job_scope != 'checks')
    env:
      PROTONVPN_PRIVATE_KEY: ${{ secrets.PROTONVPN_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Create .env file (VPN disabled — no key in CI)
        shell: bash
        run: |
          cp .env.example .env
          # Disable VPN profile so containers that depend on it can start without a real key
          sed -i 's/^GLUETUN_PROFILE=enabled/GLUETUN_PROFILE=disabled/' .env

      - name: Inject VPN key if secret is available
        if: ${{ env.PROTONVPN_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          sed -i 's/^GLUETUN_PROFILE=disabled/GLUETUN_PROFILE=enabled/' .env
          echo "${{ env.PROTONVPN_PRIVATE_KEY }}" > configs/gluetun/.secret

      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: 3.11.3

      - name: Generate self-signed certificate
        run: make generate_certificate

      - name: Start stack
        run: make start

      - name: Wait for containers to be ready
        shell: bash
        run: |
          timeout 120 bash -c '
            until docker compose ps --format json 2>/dev/null | \
              python3 -c "
          import sys, json
          containers = [json.loads(l) for l in sys.stdin if l.strip()]
          starting = [c[\"Name\"] for c in containers if c.get(\"Health\") == \"starting\"]
          print(starting); sys.exit(0 if not starting else 1)
          "; do sleep 5; done
          '

      - name: Run integration tests (skip VPN kill-switch without key)
        shell: bash
        run: |
          SKIP_MARKERS=""
          if [ -z "${{ env.PROTONVPN_PRIVATE_KEY }}" ]; then
            SKIP_MARKERS="-m 'not killswitch'"
          fi
          make test PYTEST_ARGS="$SKIP_MARKERS"

      - name: Tear down
        if: always()
        run: make stop_all
