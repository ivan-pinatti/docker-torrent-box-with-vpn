---
name: Podman Experiment

# TEMPORARY, and to be deleted before this pull request is marked ready.
#
# The suite hangs in `podman-compose up --detach` on the current runner image
# and podman's own version is the last variable left (4.9.3 passed, 5.8.4
# hangs). Testing that needs a run of the real start path with a different
# podman, and there is no way to get one from a branch: integration-tests.yml
# is triggered by `issue_comment`, which always runs the default branch's copy,
# and it carries no workflow_dispatch trigger, which would have to be on the
# default branch to be dispatchable anyway.
#
# So this exists, triggered by pushes to this branch only, and runs the start
# path and nothing after it. It stops at `make start`, which is where the
# answer is: no wiring, no tests.
on:
  push:
    branches:
      - chore/pin-podman-compose-in-ci

permissions:
  contents: read

env:
  # Flip to 'true' to re-run the control: the archive's podman 4.9.3, which
  # starts the stack where the image's 5.8.4 hangs.
  PODMAN_4_CONTROL: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  start_only:
    name: Diagnose the start hang
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install xmlstarlet
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet

      - name: Put the runner on the archive's podman 4.x
        # Off by default: 4.9.3 is proven to start the stack where 5.8.4
        # hangs, so the version question is answered and the runs stay on the
        # image's own podman 5 to diagnose what actually blocks under it. The
        # step remains as the control, one env value away.
        if: env.PODMAN_4_CONTROL == 'true'
        # The variable under test. A previous attempt installed the archive's
        # podman and changed nothing, because apt writes /usr/bin/podman while
        # the image ships /usr/local/bin/podman, which wins on PATH. Displacing
        # it is the point of this step, and the version is asserted afterwards
        # so a silent no-op cannot be mistaken for a result again.
        shell: bash
        run: |
          target=$(apt-cache madison podman | awk '{print $3}' | grep -m1 '^4\.' || true)
          if [ -z "$target" ]; then
            echo "::error::No podman 4.x in the archive; the experiment cannot run."
            exit 1
          fi
          echo "Installing podman $target over $(podman --version)"
          # conmon and crun explicitly, because the binary alone is not the
          # environment. Displacing only /usr/local/bin/podman left 4.9.3
          # driving the image's podman 5 helpers, and conmon died on the first
          # container: "conmon failed: exit status 1". A version test means
          # nothing if the helpers do not match the binary being tested.
          sudo apt-get install -y --allow-downgrades "podman=$target" conmon crun
          # The displacement. Renamed rather than removed, so the originals are
          # still there to look at if something else breaks. The helper
          # directory goes too, since that is where podman looks first for
          # conmon, netavark and aardvark-dns.
          for path in /usr/local/bin/podman /usr/local/bin/conmon /usr/local/bin/crun /usr/local/lib/podman; do
            if [ -e "$path" ]; then
              sudo mv "$path" "$path.shadowed"
              echo "displaced $path"
            fi
          done
          hash -r
          echo "conmon: $(command -v conmon || echo none)"
          command -v podman
          podman --version
          if ! podman --version | grep -q ' 4\.'; then
            echo "::error::Still not on podman 4.x, so this run would prove nothing."
            exit 1
          fi

      - name: Set up rootless Podman
        shell: bash
        run: |
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(whoami)"
          podman system migrate
          podman info
          pip install podman-compose==1.5.0
          mkdir -p "/run/user/$(id -u)/podman"
          nohup podman system service --time=0 "unix:///run/user/$(id -u)/podman/podman.sock" >/tmp/podman-service.log 2>&1 &
          timeout 30 bash -c 'until [ -S "/run/user/'"$(id -u)"'/podman/podman.sock" ]; do sleep 1; done'

      - name: Create .env file
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/^LAN_IP=192.168.1.x/LAN_IP=192.168.1.100/' .env

      - name: Point the VPN at the local mock
        shell: bash
        run: |
          sed -i 's/^VPN_MOCK_PROFILE=disabled/VPN_MOCK_PROFILE=enabled/' .env
          ./scripts/seed-vpn-mock.sh

      - name: Read PYTHON_VERSION from .env
        shell: bash
        run: grep -m1 '^PYTHON_VERSION=' .env >> "$GITHUB_ENV"

      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scripts/permissions.py's dependency
        shell: bash
        run: pip install pyyaml

      - name: Seed every app's config and secrets
        timeout-minutes: 8
        run: make seed_all

      - name: Generate self-signed certificate
        timeout-minutes: 3
        run: make generate_certificate

      - name: Log in to Docker Hub
        timeout-minutes: 2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "No Docker Hub credentials; pulling anonymously."
            exit 0
          fi
          printf '%s' "$DOCKERHUB_TOKEN" \
            | podman login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Pull container images
        timeout-minutes: 12
        run: make pull_docker_images

      - name: Start stack, and get a stack trace out of the hang
        # podman-compose is Python, so py-spy can dump exactly where it is
        # blocked without stopping it. Everything so far has only established
        # that it never returns; this is meant to say what call it is sitting
        # in, which is the difference between pinning the runtime and fixing
        # the cause.
        #
        # `make start` runs in the background so the dumps can happen while it
        # is still stuck, rather than after a timeout has killed the process
        # group and taken the evidence with it.
        timeout-minutes: 14
        shell: bash
        run: |
          pip install py-spy
          rc=0
          timeout --signal=INT 600 make start >/tmp/start.log 2>&1 &
          start_pid=$!

          dump() {
            local label="$1" pid
            pid=$(pgrep -f 'podman-compose' | head -1 || true)
            if [ -z "$pid" ]; then
              echo "no podman-compose process at $label"
              return
            fi
            echo "::group::py-spy dump at $label (pid $pid)"
            sudo env "PATH=$PATH" py-spy dump --pid "$pid" --locals \
              || sudo env "PATH=$PATH" py-spy dump --pid "$pid" \
              || echo "py-spy could not attach"
            echo "::endgroup::"
            # The stack says it is idle in select. That names the call but not
            # what it is waiting for, and the detached path opens no pipes of
            # its own (run_container passes no log_formatter, so podman-compose
            # takes the branch with no stdout/stderr PIPE), which rules out the
            # obvious answer of a reader waiting on an EOF that never comes. So
            # go a level down: which descriptors this process holds, who else
            # holds them, and what the kernel says it is blocked in.
            echo "::group::descriptors and syscall at $label"
            echo "-- /proc/$pid/syscall (select args)"
            sudo cat "/proc/$pid/syscall" 2>/dev/null || echo "unavailable"
            echo "-- /proc/$pid/fd"
            sudo ls -l "/proc/$pid/fd" 2>/dev/null || echo "unavailable"
            echo "-- threads"
            sudo ls "/proc/$pid/task" 2>/dev/null | tr '\n' ' ' || true
            echo
            echo "-- child processes still around"
            pgrep -a -P "$pid" 2>/dev/null || echo "none"
            echo "-- long lived podman helpers"
            pgrep -a -f 'conmon|aardvark|netavark|rootless' 2>/dev/null | head -20 || echo "none"
            echo "::endgroup::"
          }

          # The stack takes roughly 70 seconds to create every container, and
          # the hang starts straight after. Sampling either side of that shows
          # whether it is stuck in one call or looping.
          waited=0
          while [ "$waited" -lt 480 ]; do
            sleep 30
            waited=$((waited + 30))
            if ! kill -0 "$start_pid" 2>/dev/null; then
              echo "make start finished after ${waited}s"
              break
            fi
            case "$waited" in
              180|300|420) dump "${waited}s" ;;
            esac
          done

          wait "$start_pid" || rc=$?
          echo "make start exited $rc on $(podman --version)"
          echo "::group::tail of make start output"
          tail -30 /tmp/start.log || true
          echo "::endgroup::"
          echo "::group::podman ps -a"
          podman ps -a --format '{{.Names}}\t{{.Status}}' || true
          echo "::endgroup::"
          exit "$rc"

      - name: Tear down
        if: always()
        timeout-minutes: 5
        run: make stop_all
