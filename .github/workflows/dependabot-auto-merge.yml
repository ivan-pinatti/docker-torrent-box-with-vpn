---
name: Dependabot Auto Merge

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Approve and enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve eligible Dependabot PR
        # fetch-metadata reports the ecosystem using dependabot's internal,
        # underscored naming (confirmed live: "pre_commit", not the
        # "pre-commit" this repo's dependabot.yml itself is keyed under),
        # so a hyphenated comparison here never matched anything; all ten
        # PRs from the first run after this workflow existed skipped both
        # steps below silently, none flagged as a failure since a skipped
        # step isn't an error.
        if: |
          (
            steps.metadata.outputs.package-ecosystem == 'pre_commit' ||
            steps.metadata.outputs.package-ecosystem == 'github_actions'
          ) && (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          )
        run: gh pr review --approve "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Enable auto-merge for eligible Dependabot PR
        if: |
          (
            steps.metadata.outputs.package-ecosystem == 'pre_commit' ||
            steps.metadata.outputs.package-ecosystem == 'github_actions'
          ) && (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          )
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
