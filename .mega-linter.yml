---
ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - BASH_EXEC
  - BASH_SHELLCHECK
  - BASH_SHFMT
  - EDITORCONFIG_EDITORCONFIG_CHECKER
  - ENV_DOTENV_LINTER
  - JSON_JSONLINT
  - MARKDOWN_MARKDOWNLINT
  - PYTHON_BANDIT
  - PYTHON_RUFF
  - SPELL_CSPELL
  - SPELL_LYCHEE
  - REPOSITORY_BETTERLEAKS
  - REPOSITORY_CHECKOV
  - REPOSITORY_TRIVY
  - YAML_YAMLLINT

DISABLE_ERRORS: false
FLAVOR_SUGGESTIONS: false
SHOW_ELAPSED_TIME: true
VALIDATE_ALL_CODEBASE: false

SPELL_LYCHEE_FILTER_REGEX_INCLUDE: (^README\.md$|^LICENSE\.md$|^docs/.*\.md$|^\.github/(ISSUE_TEMPLATE/.*\.md|PULL_REQUEST_TEMPLATE\.md)$)
ENV_DOTENV_LINTER_FILTER_REGEX_INCLUDE: (^\.env\.example$)
JSON_JSONLINT_FILTER_REGEX_INCLUDE: (^\.cspell\.json$|^\.devcontainer/.*\.json$)

# betterleaks is the secret scanner that actually covers this repo's shapes.
# It scans the full git history rather than a diff, which is the gap the
# gitleaks pre-commit hook leaves, and it reads .gitleaks.toml, so the custom
# rules there apply to both. Findings that exist only in already-published
# history are recorded in .gitleaksignore. See docs/HARDENING.md.
#
# Trivy stays enabled for defence in depth, now including configs/*/config/,
# but it is not the thing catching app credentials. Verified against Trivy
# 0.58.1: it detects AWS keys, GitHub PATs and PEM private keys, and reports
# nothing for a bare `apikey = <32 hex>` in an .ini or an XML
# <CertificatePassword>.
REPOSITORY_TRIVY_FILTER_REGEX_EXCLUDE: (^configs/[^/]+/\.env($|\.)|^configs/[^/]+/secrets/|\.example$|^\.secrets\.baseline$)

# patches/ holds vendored upstream source bind-mounted into containers to
# apply local fixes; it is not code we author, so it should not be linted,
# reformatted, or spellchecked.
EDITORCONFIG_EDITORCONFIG_CHECKER_FILTER_REGEX_EXCLUDE: (^patches/)
SPELL_CSPELL_FILTER_REGEX_EXCLUDE: (^patches/)
BASH_SHELLCHECK_FILTER_REGEX_EXCLUDE: (^patches/)
BASH_SHFMT_FILTER_REGEX_EXCLUDE: (^patches/)
REPOSITORY_CHECKOV_ARGUMENTS: --skip-framework secrets --skip-path configs --skip-path media/eBooks
PYTHON_RUFF_FILTER_REGEX_INCLUDE: (^tests/)
PYTHON_BANDIT_FILTER_REGEX_INCLUDE: (^tests/)
PYTHON_BANDIT_FILTER_REGEX_EXCLUDE: (tests/\.venv/)
PYTHON_BANDIT_ARGUMENTS: "--skip B101,B105,B314,B404,B405,B501,B603"
