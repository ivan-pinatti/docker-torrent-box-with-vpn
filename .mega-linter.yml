---
ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - BASH_EXEC
  - BASH_SHELLCHECK
  - BASH_SHFMT
  - EDITORCONFIG_EDITORCONFIG_CHECKER
  - ENV_DOTENV_LINTER
  - JSON_JSONLINT
  - MARKDOWN_MARKDOWNLINT
  - PYTHON_BANDIT
  - PYTHON_RUFF
  - SPELL_CSPELL
  - SPELL_LYCHEE
  - REPOSITORY_BETTERLEAKS
  - REPOSITORY_CHECKOV
  - REPOSITORY_TRIVY
  - YAML_YAMLLINT

# betterleaks' git-mode scan runs its own git invocation inside MegaLinter's
# container, which doesn't inherit the checkout action's safe.directory
# exception on the host: confirmed live, it fails outright with "detected
# dubious ownership in repository at '/github/workspace'" without this.
PRE_COMMANDS:
  - command: git config --global --add safe.directory /github/workspace
    cwd: root
    run_before_linters: true

DISABLE_ERRORS: false
FLAVOR_SUGGESTIONS: false
# Silences the "MegaLinter <version> is out!" banner printed after every run.
# The action is pinned by major (@v9) and so already tracks the latest 9.x, and
# the banner has been announcing a version older than the one actually running.
SECURITY_SUGGESTIONS: false
SHOW_ELAPSED_TIME: true
VALIDATE_ALL_CODEBASE: false

# Runtime state, none of it code, and none of it tracked. The file-based
# linters already skip it by only looking at changed files, but project-mode
# linters (trivy, checkov, betterleaks) walk the workspace directly rather
# than going through git, so being gitignored does not keep them out.
#
# data/ is the reason this is here. It holds the media and download trees, and
# once STORAGE_REMOTE is set it is a mount of a multi-terabyte SMB share, so
# walking it means walking the NAS. trivy timed out at its full 300s doing
# exactly that during a push, having already failed once mid-walk when the
# CIFS session dropped. The rest are listed for the same reason at smaller
# scale: storage/ carries Prometheus and Loki data, logs/ grows unbounded
# between rotations.
#
# MegaLinter's own defaults are restated because setting this key replaces
# them rather than adding to them.
EXCLUDED_DIRECTORIES:
  - .git
  - .pytest_cache
  - megalinter-reports
  - node_modules
  - data
  - cache
  - logs
  - storage

SPELL_LYCHEE_FILTER_REGEX_INCLUDE: (^README\.md$|^LICENSE\.md$|^NOTICE\.md$|^docs/.*\.md$|^\.github/(ISSUE_TEMPLATE/.*\.md|PULL_REQUEST_TEMPLATE\.md)$)
ENV_DOTENV_LINTER_FILTER_REGEX_INCLUDE: (^\.env\.example$)
JSON_JSONLINT_FILTER_REGEX_INCLUDE: (^\.cspell\.json$|^\.devcontainer/.*\.json$)

# betterleaks is the secret scanner that covers this repo's credential shapes.
#
# Run in `git` mode rather than MegaLinter's default filesystem `dir` mode.
# `dir` walks the disk, and this working tree holds live credentials by design
# in gitignored paths: app databases, generated configs, certs, backups. A
# local `dir` run reported 3090 findings across 247 files, none of them
# tracked. `git` mode reads commits, which is the actual question.
#
# On a pull request, PR_COMMITS_SCAN narrows that to just the PR's commits, so
# routine runs stay incremental; the full history is only walked outside a PR,
# and that costs ~250ms for this repo.
#
# CONFIG_FILE is set because betterleaks looks for .betterleaks.toml by
# default, while the gitleaks pre-commit hook uses .gitleaks.toml. Pointing
# both at one file keeps the custom rules in step.
#
# Findings that exist only in already-published history are recorded as
# fingerprints in .gitleaksignore. See docs/HARDENING.md.
REPOSITORY_BETTERLEAKS_CONFIG_FILE: .gitleaks.toml
REPOSITORY_BETTERLEAKS_COMMAND_REMOVE_ARGUMENTS: ["dir"]
REPOSITORY_BETTERLEAKS_ARGUMENTS: ["git"]
REPOSITORY_BETTERLEAKS_PR_COMMITS_SCAN: true
#
# Trivy stays enabled for defense in depth, now including configs/*/config/,
# but it is not the thing catching app credentials. Verified against Trivy
# 0.58.1: it detects AWS keys, GitHub PATs and PEM private keys, and reports
# nothing for a bare `apikey = <32 hex>` in an .ini or an XML
# <CertificatePassword>.
REPOSITORY_TRIVY_FILTER_REGEX_EXCLUDE: (^configs/[^/]+/\.env($|\.)|^configs/[^/]+/secrets/|\.example$|^\.secrets\.baseline$)
# DS-0002 and DS-0026 on build/*/Dockerfile are suppressed with a reason in
# .trivyignore.yaml. Passed explicitly: trivy auto-detects a plain
# .trivyignore but not the YAML form, and only YAML supports path scoping.
REPOSITORY_TRIVY_ARGUMENTS: "--ignorefile .trivyignore.yaml"

# patches/ holds vendored upstream source bind-mounted into containers to
# apply local fixes; it is not code we author, so it should not be linted,
# reformatted, or spellchecked.
EDITORCONFIG_EDITORCONFIG_CHECKER_FILTER_REGEX_EXCLUDE: (^patches/)
BASH_SHFMT_FILTER_REGEX_EXCLUDE: (^patches/)

# configs/*/config/ holds files the applications generate: Qt window state,
# base64 blobs, provider names. Spellchecking those yields nothing but noise
# (186 unknown "words" in one run, almost all base64). .gitleaksignore is
# machine-generated commit fingerprints for the same reason.
SPELL_CSPELL_FILTER_REGEX_EXCLUDE: (^patches/|^configs/.*/config/|^configs/.*/custom-(cont-init|services)\.d/|^\.gitleaksignore$)

# custom-cont-init.d and custom-services.d hold third-party arr-scripts
# bootstrap scripts, vendored the same way as patches/ and not ours to fix.
BASH_SHELLCHECK_FILTER_REGEX_EXCLUDE: (^patches/|^configs/.*/custom-(cont-init|services)\.d/)
# Match the severity the pre-commit shellcheck hook uses, so a finding either
# fails both gates or neither. Without this, MegaLinter reports info-level
# style notes that the commit-time hook deliberately ignores.
BASH_SHELLCHECK_ARGUMENTS: "--severity=error"
REPOSITORY_CHECKOV_ARGUMENTS: --skip-framework secrets --skip-path configs
PYTHON_RUFF_FILTER_REGEX_INCLUDE: (^tests/)
PYTHON_BANDIT_FILTER_REGEX_INCLUDE: (^tests/)
PYTHON_BANDIT_FILTER_REGEX_EXCLUDE: (tests/\.venv/)
PYTHON_BANDIT_ARGUMENTS: "--skip B101,B105,B314,B404,B405,B501,B603,B607"
