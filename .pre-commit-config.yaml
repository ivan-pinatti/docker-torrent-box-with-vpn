---
default_install_hook_types: [pre-commit, pre-push]
minimum_pre_commit_version: 4.0.1

# Two separate exclude sets, for two unrelated reasons. Keep them apart:
# collapsing them back into one anchor is what previously let the secret
# scanners and the formatters share a pattern that suited neither.
#
# placeholder_credentials covers files whose committed content is
# deliberately fake: templates (.env), compose-secret seeds
# (secrets/*.example), and .example configs all ship `changeme` and
# repeating-digit API keys on purpose, so the secret scanners would report
# nothing but placeholders. Real values never live in a committed file
# matching this pattern.
#
# app_managed covers files the applications own and rewrite on shutdown.
# Structural and whitespace hooks skip these, because reformatting them
# fights the app. The secret scanners deliberately do NOT skip them: this
# is exactly where a real credential lands if one is ever committed.
#
# Both patterns anchor every alternative. An earlier version wrote
# `^(a|configs/.*/config/|c)$`, where the trailing `$` applied to the whole
# group, so the `configs/.*/config/` branch could only ever match a path
# ending in a slash, and therefore matched no file at all.

repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        require_serial: true
        exclude: &placeholder_credentials '^(configs/[^/]+/\.env(\..*)?|configs/[^/]+/secrets/.*|.*\.example|\.secrets\.baseline)$|^patches/'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        exclude: *placeholder_credentials

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: &app_managed '^(configs/calibre/config/.*|configs/nzbget/config/nzbget\.conf|configs/qbittorrent/config/.*|configs/recyclarr/config/.*\.yml|\.secrets\.baseline)$'
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
        exclude: *app_managed
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-xml
        exclude: *app_managed
      - id: check-yaml
        # docker-compose.routes/*.yml use Compose's `!reset` merge tag, which
        # PyYAML (this hook's parser) doesn't recognize as a constructor.
        # yamllint still validates their structure and style.
        exclude: '^(docker-compose\.routes/.*\.ya?ml|configs/recyclarr/config/.*\.yml|\.secrets\.baseline)$'
      - id: destroyed-symlinks
      - id: detect-private-key
      # configs/*/secrets/ is excluded because those single-line files are
      # credential templates: seed-secrets.sh copies them into the live
      # secret, and a trailing newline would land in the credential. The
      # script strips it defensively, but the files should not churn.
      - id: end-of-file-fixer
        exclude: &app_managed_or_patches '^(configs/calibre/config/.*|configs/nzbget/config/nzbget\.conf|configs/qbittorrent/config/.*|configs/[^/]+/secrets/.*|configs/recyclarr/config/.*\.yml|\.secrets\.baseline)$|^patches/'
      - id: mixed-line-ending
        exclude: *app_managed_or_patches
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        exclude: *app_managed_or_patches
      - id: check-ast
        files: ^tests/
      - id: debug-statements
        files: ^tests/
      - id: requirements-txt-fixer
        files: ^tests/requirements\.txt$

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.8.0
    hooks:
      - id: editorconfig-checker
        exclude: &vendored_patches '^patches/'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=error"]
        # Third-party arr-scripts bootstrap scripts, vendored like patches/.
        exclude: '^patches/|^configs/.*/custom-(cont-init|services)\.d/'

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shfmt
        args: ["--indent", "2", "--list", "--write"]
        exclude: *vendored_patches

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: *app_managed

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.1
    hooks:
      - id: cspell
        # configs/*/config/ is application-generated (Qt state, base64 blobs);
        # .gitleaksignore is machine-generated commit fingerprints.
        exclude: '^patches/|^configs/.*/config/|^configs/.*/custom-(cont-init|services)\.d/|^\.gitleaksignore$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^tests/
      - id: ruff-format
        files: ^tests/

  # CI runs `pre-commit run --all-files`, while the commit-stage hooks only ever
  # see staged files and the push-stage ones only the range being pushed. A
  # violation in a file the branch never touched therefore passes locally and
  # fails in CI, which is what a linter version bump produces. This runs the
  # same sweep CI does, before the push rather than after it.
  #
  # It cannot recurse: `pre-commit run --all-files` selects the pre-commit
  # stage, and this hook is pre-push only. megalinter-incremental is skipped
  # inside it because under --all-files that is the same work megalinter-full
  # does immediately afterwards, and doing it twice costs about four minutes
  # for one answer.
  - repo: local
    hooks:
      - id: all-files-sweep
        name: Run the fast hooks over every file, as CI does
        entry: env SKIP=megalinter-incremental pre-commit run --all-files
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  # Moved out of MegaLinter with the switch to its security flavor, which does
  # not carry actionlint. Unlike lychee and dotenv-linter it has a real
  # pre-commit hook, so it runs at commit time here rather than only in CI.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/oxsecurity/megalinter
    rev: v9.6.0
    hooks:
      - id: megalinter-incremental
        stages: [pre-commit]
        verbose: true
      - id: megalinter-full
        stages: [pre-push]
        verbose: true

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
