---
default_install_hook_types: [pre-commit, pre-push]
minimum_pre_commit_version: 4.0.1

repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        require_serial: true
        exclude: '^(configs/.*/\.env\.secrets\.example|\.secrets\.baseline)$|^patches/'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        exclude: &runtime_placeholders '^(configs/.*/\.env|configs/.*/config/|configs/recyclarr/config/.*\.yml|media/eBooks/metadata\.db|\.secrets\.baseline)$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: *runtime_placeholders
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
        exclude: *runtime_placeholders
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-xml
        exclude: *runtime_placeholders
      - id: check-yaml
        # docker-compose.routes/*.yml use Compose's `!reset` merge tag, which
        # PyYAML (this hook's parser) doesn't recognize as a constructor.
        # yamllint still validates their structure and style.
        exclude: '^(docker-compose\.routes/.*\.ya?ml|configs/.*/\.env|configs/.*/config/|configs/recyclarr/config/.*\.yml|media/eBooks/metadata\.db|\.secrets\.baseline)$'
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: '^(configs/.*/\.env|configs/.*/config/|configs/.*/secrets/.*|configs/recyclarr/config/.*\.yml|media/eBooks/metadata\.db|\.secrets\.baseline)$|^patches/'
      - id: mixed-line-ending
        exclude: '^(configs/.*/\.env|configs/.*/config/|configs/.*/secrets/.*|configs/recyclarr/config/.*\.yml|media/eBooks/metadata\.db|\.secrets\.baseline)$|^patches/'
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        exclude: '^(configs/.*/\.env|configs/.*/config/|configs/.*/secrets/.*|configs/recyclarr/config/.*\.yml|media/eBooks/metadata\.db|\.secrets\.baseline)$|^patches/'
      - id: check-ast
        files: ^tests/
      - id: debug-statements
        files: ^tests/
      - id: requirements-txt-fixer
        files: ^tests/requirements\.txt$

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker
        exclude: &vendored_patches '^patches/'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=error"]

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shfmt
        args: ["--indent", "2", "--list", "--write"]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: *runtime_placeholders

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v9.7.0
    hooks:
      - id: cspell
        exclude: *vendored_patches

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^tests/
      - id: ruff-format
        files: ^tests/

  - repo: https://github.com/oxsecurity/megalinter
    rev: v9.4.0
    hooks:
      - id: megalinter-incremental
        stages: [pre-commit]
        verbose: true
      - id: megalinter-full
        stages: [pre-push]
        verbose: true

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.21.0
    hooks:
      - id: markdownlint-cli2
