server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: "info"

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: docker

scrape_configs:
  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-access
          __path__: /nginxlogs/*-access.log
    relabel_configs:
      - source_labels: [__path__]
        regex: .*/([^/]+)-access\.log
        target_label: service
        replacement: "${1}"
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) \S+ - \S+ \[[^\]]+\] "[^"]*" (?P<status>\d+)'
      - labels:
          status:

  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-error
          __path__: /nginxlogs/*-error.log
    relabel_configs:
      - source_labels: [__path__]
        regex: .*/([^/]+)-error\.log
        target_label: service
        replacement: "${1}"
