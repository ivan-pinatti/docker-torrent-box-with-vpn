# my global config
global:
  scrape_interval: 10s # default is every 1 minute.
  evaluation_interval: 10s # default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    monitor: "docker-host"

# Load and evaluate rules in this file every 'evaluation_interval' seconds.
rule_files:
  # - "alert.rules"

# A scrape configuration containing exactly one endpoint to scrape.
scrape_configs:
  # Docker daemon metrics — not available in rootless Podman
  # - job_name: docker
  #   static_configs:
  #     - targets: ['host.docker.internal:9323']

  - job_name: cadvisor
    metrics_path: /admin/cadvisor/metrics
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: podman
    static_configs:
      - targets: ['podman_exporter:9882']

  - job_name: podman_limits_exporter
    static_configs:
      - targets: ['podman_limits_exporter:9889']

  - job_name: node_exporter
    metrics_path: /admin/node_exporter/metrics
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: prometheus
    metrics_path: /admin/prometheus/metrics
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: qbittorrent
    static_configs:
      - targets: ['qbittorrent_exporter:17871']

  - job_name: sabnzbd
    static_configs:
      - targets: ['sabnzbd_exporter:9387']

  # - job_name: pushgateway
  #   honor_labels: true
  #   static_configs:
  #     - targets: ['pushgateway:9091']

# alerting:
#   alertmanagers:
#   - scheme: http
#     static_configs:
#     - targets:
#       - 'alertmanager:9093'

  - job_name: nginx
    static_configs:
      - targets: ['nginx_exporter:9113']

