name: torrent

x-healthcheck-defaults: &healthcheck-defaults
  interval: 60s
  retries: 5
  start_period: 30s
  timeout: 10s

x-limit-downloaders: &limit-downloaders
  deploy:
    resources:
      limits:
        memory: ${DOWNLOADERS_MEMORY}
        cpus: "${DOWNLOADERS_CPUS}"

secrets:
  # qBittorrent's username/password, owned here since qbittorrent is the
  # service that issues them (qbittorrent itself never reads the password
  # from env, but the value is generated/rotated alongside this service).
  # qbittorrent_exporter (docker-compose-observability.yml) and homepage
  # (docker-compose-proxy.yml) each declare an identical copy of this block so
  # every file resolves it standalone; see docs/COMPOSE_CONVENTIONS.md. Keep
  # the `file:` paths identical across all three, compose does not detect a
  # mismatch, it silently uses whichever declaration was included last.
  qbittorrent_username:
    file: ./configs/qbittorrent/secrets/username.txt
    x-podman.relabel: z
  qbittorrent_password:
    file: ./configs/qbittorrent/secrets/password.txt
    x-podman.relabel: z
  # Consumed only by jdownloader2 itself (single consumer, no duplicate
  # needed elsewhere), through the image's own secrets loader.
  #
  # The CONT_ENV_ prefix is load bearing, not decoration. /init's cont-secrets
  # stage runs `find /run/secrets -maxdepth 1 -type f -name "CONT_ENV_*"` and
  # derives the environment variable name by stripping exactly that prefix, so
  # the secret's compose name *is* the variable name. A secret called
  # jdownloader2_username, which is what these were while
  # patches/jdownloader2/10-webauth.sh read the files directly, is simply not
  # seen by that loop.
  CONT_ENV_WEB_AUTHENTICATION_USERNAME:
    file: ./configs/jdownloader2/secrets/username.txt
    x-podman.relabel: z
  CONT_ENV_WEB_AUTHENTICATION_PASSWORD:
    file: ./configs/jdownloader2/secrets/password.txt
    x-podman.relabel: z

services:
  qbittorrent:
    <<: *limit-downloaders
    image: docker.io/linuxserver/qbittorrent:${QBITTORRENT_VERSION}
    container_name: ${CONTAINER_PREFIX}qbittorrent
    depends_on:
      ${VPN_PROVIDER}:
        condition: service_healthy
        restart: true
    profiles: ["${QBITTORRENT_PROFILE}"]
    network_mode: container:${CONTAINER_PREFIX}${VPN_PROVIDER}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      [
        "${CONFIG_FOLDER}/qbittorrent/.env",
        "${CONFIG_FOLDER}/qbittorrent/.env.secrets",
      ]
    environment:
      [
        "PGID=${QBITTORRENT_GID}",
        "PUID=${QBITTORRENT_UID}",
        "UMASK=${UMASK}",
        "TZ=${TIMEZONE}",
        "WEBUI_PORT=${QBITTORRENT_HTTPS_PORT}",
      ]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CERTIFICATES_FOLDER}:/certs:ro,z
      - ${CONFIG_FOLDER}/qbittorrent/config:/config:z
      - ${TORRENTS_FOLDER}:/data/torrents${DATA_VOLUME_FLAGS}
    healthcheck:
      <<: *healthcheck-defaults
      test: curl --fail --insecure https://${GLUETUN_SERVICES_IP}:${QBITTORRENT_HTTPS_PORT}/ || exit 1
  jdownloader2:
    <<: *limit-downloaders
    image: docker.io/jlesage/jdownloader-2:${JDOWNLOADER2_VERSION}
    container_name: ${CONTAINER_PREFIX}jdownloader2
    depends_on:
      ${VPN_PROVIDER}:
        condition: service_healthy
        restart: true
    profiles: ["${JDOWNLOADER2_PROFILE}"]
    network_mode: container:${CONTAINER_PREFIX}${VPN_PROVIDER}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      [
        "${CONFIG_FOLDER}/jdownloader2/.env",
        "${CONFIG_FOLDER}/jdownloader2/.env.secrets",
      ]
    environment:
      ["USER_ID=${JDOWNLOADER2_UID}", "GROUP_ID=${JDOWNLOADER2_GID}", "TZ=${TIMEZONE}"]
    # Credentials arrive through this image's own Docker-secrets support
    # (CONT_ENV_<VAR>, documented for jlesage/docker-baseimage).
    #
    # That support used to be broken here, and this service carried
    # patches/jdownloader2/10-webauth.sh to work around it: the Dockerfile
    # pre-declares WEB_AUTHENTICATION_USERNAME/PASSWORD as empty-string env
    # vars, and the loader in /init only set a variable that was currently
    # *unset*, so it always found them already "set" (to "") and silently
    # skipped the secret. baseimage-gui 4.13.0 fixed it by giving load_env_var
    # a `force` argument that secrets pass, and v26.08.1 of this image is built
    # on 4.13.1, so the patch was overwriting a file that no longer needed it.
    # Verified by extracting /init from the pinned image. See issue #107.
    #
    # The secrets are named CONT_ENV_WEB_AUTHENTICATION_USERNAME and
    # CONT_ENV_WEB_AUTHENTICATION_PASSWORD for that loader's benefit; see the
    # `secrets:` declarations at the top of this file for why the prefix
    # matters. WEB_AUTHENTICATION=1 comes from configs/jdownloader2/.env, and
    # the image's own default is 0.
    secrets:
      [CONT_ENV_WEB_AUTHENTICATION_USERNAME, CONT_ENV_WEB_AUTHENTICATION_PASSWORD]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_FOLDER}/jdownloader2/config:/config:z
      - ${DOWNLOADS_FOLDER}:/data/downloads${DATA_VOLUME_FLAGS}
    healthcheck:
      <<: *healthcheck-defaults
      # SECURE_CONNECTION=1 serves the web UI over https with a self-signed
      # certificate; the login portal answers unauthenticated requests.
      test: curl --fail --silent --insecure https://127.0.0.1:${JDOWNLOADER2_HTTP_PORT}/ || exit 1
